name: Firmware sanity
on:
  push:
    paths: ["Codigos/IDroid/**", ".github/workflows/firmware.yml"]
  pull_request:
    paths: ["Codigos/IDroid/**", ".github/workflows/firmware.yml"]
permissions:
  contents: read
jobs:
  host-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 Codigos/IDroid/tests/run_host_tests.py --cc gcc
  esp32c6:
    runs-on: ubuntu-24.04
    container: espressif/idf:v5.5.1
    strategy:
      matrix:
        configuration: [default, diagnostics]
    defaults:
      run:
        shell: bash
        working-directory: Codigos/IDroid
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pinned ESP-IDF Python tools
        run: |
          . /opt/esp/idf/export.sh
          python -m pip install -r tests/requirements-build.txt
          python -c 'from importlib.metadata import version; print("idf-component-manager:", version("idf-component-manager")); print("esp-idf-kconfig:", version("esp-idf-kconfig"))'
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Build ESP32-C6
        run: |
          . /opt/esp/idf/export.sh
          if [ "${{ matrix.configuration }}" = diagnostics ]; then
            idf.py -B build-diagnostics -D SDKCONFIG=build-diagnostics/sdkconfig \
              -D 'SDKCONFIG_DEFAULTS=sdkconfig.defaults;tests/sdkconfig.diagnostics.defaults' build
          else
            idf.py -D SDKCONFIG=build/sdkconfig build
          fi
          git diff --exit-code -- dependencies.lock
