<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 920" width="1500" height="920"
     font-family="DejaVu Sans, Liberation Sans, sans-serif" role="img"
     aria-label="Esquema conceitual da matriz lógica quadrada de 240 por 240 pixels de um display circular. O círculo físico visível tem centro aproximado em 120,120 e raio aproximado de 120 pixels. A origem está no canto superior esquerdo, x cresce para a direita e y para baixo. Os cantos lógicos ficam fora da área física visível.">
  <defs>
    <marker id="arrowGraphite" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#263238"/>
    </marker>
    <marker id="arrowBlue" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#1565C0"/>
    </marker>
    <marker id="arrowBlueStart" markerWidth="9" markerHeight="9" refX="0.5" refY="4.5" orient="auto">
      <path d="M8,0 L0,4.5 L8,9 Z" fill="#1565C0"/>
    </marker>
    <marker id="arrowTeal" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#00796B"/>
    </marker>
    <marker id="arrowAmber" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#F9A825"/>
    </marker>
    <style>
      .title       { font-size: 25px; font-weight: 700; fill: #263238; }
      .subtitle    { font-size: 14px; font-style: italic; fill: #607178; }
      .panel       { font-size: 18px; font-weight: 700; fill: #263238; }
      .heading     { font-size: 15px; font-weight: 700; fill: #263238; }
      .label       { font-size: 14px; fill: #263238; }
      .label-bold  { font-size: 14px; font-weight: 700; fill: #263238; }
      .small       { font-size: 12px; fill: #607178; }
      .small-bold  { font-size: 12px; font-weight: 700; }
      .coordinate  { font-size: 12px; fill: #263238; }
      .legend      { font-size: 12.5px; fill: #263238; }
      .note        { font-size: 12px; font-style: italic; fill: #607178; }
    </style>
  </defs>

  <rect x="0" y="0" width="1500" height="920" fill="#FFFFFF"/>

  <text x="750" y="42" text-anchor="middle" class="title">Geometria lógica e área visível de um display circular</text>
  <text x="750" y="69" text-anchor="middle" class="subtitle">figura conceitual — matriz 240 × 240 configurada para o GC9A01A no firmware</text>

  <!-- Área principal -->
  <rect x="36" y="100" width="1428" height="735" rx="9" fill="#F9FBFB"
        stroke="#B8C1C5" stroke-width="1.4" stroke-dasharray="7 5"/>
  <text x="66" y="132" class="panel">Vista frontal da matriz lógica</text>

  <!-- Matriz lógica e área física -->
  <rect x="100" y="150" width="640" height="640" fill="#F4E8D7"
        stroke="#263238" stroke-width="2.4"/>
  <circle cx="420" cy="470" r="320" fill="#F7FBFC"/>

  <!-- Grade lógica de referência -->
  <g stroke="#D6DEE1" stroke-width="1.2">
    <line x1="260" y1="150" x2="260" y2="790"/>
    <line x1="420" y1="150" x2="420" y2="790"/>
    <line x1="580" y1="150" x2="580" y2="790"/>
    <line x1="100" y1="310" x2="740" y2="310"/>
    <line x1="100" y1="470" x2="740" y2="470"/>
    <line x1="100" y1="630" x2="740" y2="630"/>
  </g>
  <circle cx="420" cy="470" r="320" fill="none" stroke="#1565C0" stroke-width="3.2"/>

  <!-- Dimensões lógicas -->
  <line x1="104" y1="814" x2="736" y2="814" stroke="#1565C0" stroke-width="1.8"
        marker-start="url(#arrowBlueStart)" marker-end="url(#arrowBlue)"/>
  <text x="420" y="806" text-anchor="middle" class="label-bold" fill="#1565C0">240 px</text>
  <line x1="69" y1="154" x2="69" y2="786" stroke="#1565C0" stroke-width="1.8"
        marker-start="url(#arrowBlueStart)" marker-end="url(#arrowBlue)"/>
  <text transform="rotate(-90 57 470)" x="57" y="470" text-anchor="middle"
        class="label-bold" fill="#1565C0">240 px</text>

  <!-- Eixos cartesianos da interface -->
  <circle cx="100" cy="150" r="6" fill="#263238"/>
  <line x1="100" y1="150" x2="785" y2="150" stroke="#263238" stroke-width="2"
        marker-end="url(#arrowGraphite)"/>
  <line x1="100" y1="150" x2="100" y2="824" stroke="#263238" stroke-width="2"
        marker-end="url(#arrowGraphite)"/>
  <text x="790" y="157" class="label-bold">+x</text>
  <text x="88" y="824" text-anchor="end" class="label-bold">+y</text>
  <rect x="109" y="158" width="64" height="25" rx="4" fill="#FFFFFF" stroke="#B8C1C5" stroke-width="1"/>
  <text x="141" y="175" text-anchor="middle" class="coordinate">(0,0)</text>

  <!-- Rótulos dos limites de coordenadas -->
  <text x="734" y="173" text-anchor="end" class="coordinate">x = 239</text>
  <text x="111" y="780" class="coordinate">y = 239</text>

  <!-- Linhas de centro -->
  <g stroke="#1565C0" stroke-width="1.4" stroke-dasharray="6 5">
    <line x1="420" y1="168" x2="420" y2="772"/>
    <line x1="118" y1="470" x2="722" y2="470"/>
  </g>

  <!-- Zona segura conceitual -->
  <rect x="255" y="330" width="330" height="275" rx="28" fill="#E8F4F2" opacity="0.82"
        stroke="#00796B" stroke-width="2.4" stroke-dasharray="9 6"/>
  <text x="420" y="360" text-anchor="middle" class="small-bold" fill="#00796B">zona segura conceitual</text>
  <text x="420" y="410" text-anchor="middle" class="heading" fill="#263238">Texto seguro</text>
  <rect x="348" y="527" width="144" height="44" rx="8" fill="#FFFFFF"
        stroke="#00796B" stroke-width="2"/>
  <text x="420" y="555" text-anchor="middle" class="label-bold" fill="#00796B">BOTÃO</text>

  <!-- Objeto lógico próximo ao canto: extensão total e parcela visível -->
  <rect x="550" y="190" width="150" height="62" rx="8" fill="none"
        stroke="#F9A825" stroke-width="2.2" stroke-dasharray="7 5"/>
  <path d="M550 190 H575 A320 320 0 0 1 654 252 H550 Z" fill="#F9A825" opacity="0.88"/>
  <text x="594" y="231" text-anchor="middle" class="small-bold" fill="#263238">OBJETO</text>

  <!-- Centro e raio em primeiro plano -->
  <circle cx="420" cy="470" r="7" fill="#1565C0" stroke="#FFFFFF" stroke-width="2"/>
  <rect x="340" y="480" width="160" height="28" rx="4" fill="#FFFFFF" stroke="#1565C0" stroke-width="1.2"/>
  <text x="420" y="499" text-anchor="middle" class="coordinate">centro ≈ (120,120)</text>
  <line x1="430" y1="470" x2="730" y2="470" stroke="#F9A825" stroke-width="2.6"
        marker-end="url(#arrowAmber)"/>
  <rect x="535" y="435" width="112" height="27" rx="4" fill="#FFFFFF" stroke="#F9A825" stroke-width="1.2"/>
  <text x="591" y="453" text-anchor="middle" class="label-bold" fill="#9A6500">r ≈ 120 px</text>

  <!-- Marcas breves nos cantos -->
  <text x="126" y="214" class="small-bold" fill="#8B6A38">não visível</text>
  <text x="714" y="752" text-anchor="end" class="small-bold" fill="#8B6A38">não visível</text>

  <!-- ================= PAINEL DE LEITURA ================= -->
  <rect x="830" y="150" width="580" height="150" rx="8" fill="#FFFFFF"
        stroke="#1565C0" stroke-width="1.5"/>
  <text x="855" y="180" class="heading" fill="#1565C0">Parâmetros do esquema</text>
  <text x="855" y="211" class="label-bold">Matriz lógica</text>
  <text x="1045" y="211" class="coordinate">240 × 240 px (firmware)</text>
  <text x="855" y="241" class="label-bold">Centro aproximado</text>
  <text x="1045" y="241" class="coordinate">(120,120)</text>
  <text x="855" y="271" class="label-bold">Raio físico aproximado</text>
  <text x="1090" y="271" class="coordinate">120 px</text>

  <rect x="830" y="325" width="580" height="130" rx="8" fill="#FFFFFF"
        stroke="#263238" stroke-width="1.4"/>
  <text x="855" y="355" class="heading">Coordenadas da interface</text>
  <circle cx="861" cy="382" r="4" fill="#263238"/>
  <text x="876" y="387" class="label">origem no canto superior esquerdo</text>
  <line x1="857" y1="412" x2="902" y2="412" stroke="#263238" stroke-width="1.8"
        marker-end="url(#arrowGraphite)"/>
  <text x="917" y="417" class="label">x para a direita</text>
  <line x1="1130" y1="395" x2="1130" y2="435" stroke="#263238" stroke-width="1.8"
        marker-end="url(#arrowGraphite)"/>
  <text x="1147" y="417" class="label">y para baixo</text>

  <rect x="830" y="480" width="580" height="170" rx="8" fill="#FFFFFF"
        stroke="#00796B" stroke-width="1.5"/>
  <text x="855" y="510" class="heading" fill="#00796B">Leitura geométrica</text>
  <text x="855" y="541" class="label-bold" fill="#00796B">Zona segura</text>
  <text x="965" y="541" class="label">recomendação conceitual de composição</text>
  <text x="965" y="565" class="small">não constitui limite normativo</text>
  <text x="855" y="601" class="label-bold" fill="#9A6500">Cantos lógicos</text>
  <text x="985" y="601" class="label">endereçáveis, porém fora do círculo visível</text>
  <text x="855" y="629" class="label-bold" fill="#9A6500">Objeto periférico</text>
  <text x="1005" y="629" class="label">pode ser recortado pela borda física</text>

  <!-- Setas de associação -->
  <path d="M830 548 C770 548 680 565 588 565" fill="none" stroke="#00796B" stroke-width="2"
        marker-end="url(#arrowTeal)"/>
  <path d="M830 617 C775 610 748 565 718 525" fill="none" stroke="#F9A825" stroke-width="2"
        marker-end="url(#arrowAmber)"/>
  <path d="M830 258 C770 248 730 230 692 222" fill="none" stroke="#F9A825" stroke-width="2"
        marker-end="url(#arrowAmber)"/>

  <!-- Legenda -->
  <rect x="830" y="680" width="580" height="110" rx="8" fill="#F7FAFB"
        stroke="#B8C1C5" stroke-width="1.2"/>
  <text x="855" y="708" class="heading">Legenda</text>
  <rect x="855" y="728" width="34" height="22" fill="#F4E8D7" stroke="#263238" stroke-width="1.2"/>
  <text x="901" y="744" class="legend">canto lógico não visível</text>
  <circle cx="1125" cy="739" r="14" fill="#F7FBFC" stroke="#1565C0" stroke-width="2"/>
  <text x="1152" y="744" class="legend">área física visível</text>
  <rect x="855" y="760" width="38" height="22" rx="5" fill="#E8F4F2"
        stroke="#00796B" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="905" y="776" class="legend">zona segura conceitual</text>
  <rect x="1160" y="760" width="38" height="22" rx="4" fill="#F9A825" opacity="0.65"/>
  <text x="1210" y="776" class="legend">objeto recortado</text>

  <!-- Rodapé -->
  <line x1="36" y1="860" x2="1464" y2="860" stroke="#B8C1C5" stroke-width="1.2"/>
  <text x="46" y="889" class="note">Fonte: elaborado pelo autor.</text>
  <text x="1454" y="889" text-anchor="end" class="note">geometria aproximada · zona segura sem caráter normativo</text>
</svg>
