<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1500 840" width="1500" height="840"
     font-family="DejaVu Sans, Liberation Sans, sans-serif" role="img"
     aria-label="Figura conceitual em três planos cartesianos de mesma escala. O primeiro mostra uma nuvem circular ideal centrada na origem; o segundo, a mesma nuvem deslocada por hard-iron; o terceiro, uma nuvem deslocada, elíptica e rotacionada por hard-iron e soft-iron, além da nuvem corrigida aproximadamente circular e centrada.">
  <defs>
    <marker id="arrowGraphite" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#263238"/>
    </marker>
    <marker id="arrowTeal" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#00796B"/>
    </marker>
    <marker id="arrowAmber" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto-start-reverse">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#F9A825"/>
    </marker>
    <g id="cloudCircle">
      <circle cx="118" cy="0" r="4.8"/>
      <circle cx="112" cy="36" r="4.8"/>
      <circle cx="96" cy="71" r="4.8"/>
      <circle cx="70" cy="99" r="4.8"/>
      <circle cx="38" cy="113" r="4.8"/>
      <circle cx="0" cy="119" r="4.8"/>
      <circle cx="-37" cy="115" r="4.8"/>
      <circle cx="-70" cy="98" r="4.8"/>
      <circle cx="-96" cy="71" r="4.8"/>
      <circle cx="-113" cy="36" r="4.8"/>
      <circle cx="-119" cy="0" r="4.8"/>
      <circle cx="-112" cy="-36" r="4.8"/>
      <circle cx="-97" cy="-70" r="4.8"/>
      <circle cx="-70" cy="-98" r="4.8"/>
      <circle cx="-36" cy="-112" r="4.8"/>
      <circle cx="0" cy="-120" r="4.8"/>
      <circle cx="36" cy="-112" r="4.8"/>
      <circle cx="70" cy="-98" r="4.8"/>
      <circle cx="97" cy="-70" r="4.8"/>
      <circle cx="112" cy="-36" r="4.8"/>
    </g>
    <g id="cloudEllipse">
      <circle cx="123" cy="0" r="4.8"/>
      <circle cx="117" cy="22" r="4.8"/>
      <circle cx="99" cy="42" r="4.8"/>
      <circle cx="72" cy="58" r="4.8"/>
      <circle cx="38" cy="68" r="4.8"/>
      <circle cx="0" cy="72" r="4.8"/>
      <circle cx="-38" cy="68" r="4.8"/>
      <circle cx="-72" cy="58" r="4.8"/>
      <circle cx="-99" cy="42" r="4.8"/>
      <circle cx="-117" cy="22" r="4.8"/>
      <circle cx="-123" cy="0" r="4.8"/>
      <circle cx="-117" cy="-22" r="4.8"/>
      <circle cx="-99" cy="-42" r="4.8"/>
      <circle cx="-72" cy="-58" r="4.8"/>
      <circle cx="-38" cy="-68" r="4.8"/>
      <circle cx="0" cy="-72" r="4.8"/>
      <circle cx="38" cy="-68" r="4.8"/>
      <circle cx="72" cy="-58" r="4.8"/>
      <circle cx="99" cy="-42" r="4.8"/>
      <circle cx="117" cy="-22" r="4.8"/>
    </g>
    <style>
      .title       { font-size: 25px; font-weight: 700; fill: #263238; }
      .subtitle    { font-size: 14px; font-style: italic; fill: #607178; }
      .panel-title { font-size: 18px; font-weight: 700; fill: #263238; }
      .panel-sub   { font-size: 13px; fill: #607178; }
      .axis-label  { font-size: 14px; font-style: italic; fill: #263238; }
      .origin      { font-size: 12px; fill: #607178; }
      .label       { font-size: 13px; font-weight: 700; fill: #263238; }
      .small       { font-size: 12px; fill: #607178; }
      .legend      { font-size: 12.5px; fill: #263238; }
      .call-title  { font-size: 15px; font-weight: 700; fill: #263238; }
      .call-text   { font-size: 13px; fill: #263238; }
      .source      { font-size: 12px; font-style: italic; fill: #607178; }
    </style>
  </defs>

  <rect x="0" y="0" width="1500" height="840" fill="#FFFFFF"/>

  <text x="750" y="42" text-anchor="middle" class="title">Efeitos geométricos na calibração magnética</text>
  <text x="750" y="69" text-anchor="middle" class="subtitle">representação conceitual · pontos sintéticos · mesma escala nos três planos</text>

  <!-- Painéis -->
  <rect x="35" y="105" width="455" height="565" rx="9" fill="#F8FAFB"
        stroke="#B8C1C5" stroke-width="1.3"/>
  <rect x="522" y="105" width="455" height="565" rx="9" fill="#F8FAFB"
        stroke="#B8C1C5" stroke-width="1.3"/>
  <rect x="1009" y="105" width="455" height="565" rx="9" fill="#F8FAFB"
        stroke="#B8C1C5" stroke-width="1.3"/>

  <text x="262.5" y="140" text-anchor="middle" class="panel-title">1  Campo ideal</text>
  <text x="262.5" y="163" text-anchor="middle" class="panel-sub">nuvem circular e centrada</text>

  <text x="749.5" y="140" text-anchor="middle" class="panel-title">2  Efeito hard-iron</text>
  <text x="749.5" y="163" text-anchor="middle" class="panel-sub">deslocamento do centro</text>

  <text x="1236.5" y="140" text-anchor="middle" class="panel-title">3  Hard-iron + soft-iron</text>
  <text x="1236.5" y="163" text-anchor="middle" class="panel-sub">deslocamento, deformação e correção</text>

  <!-- Grades quadradas de mesma escala -->
  <g fill="#FFFFFF" stroke="#D5DDE0" stroke-width="1.2">
    <rect x="82" y="190" width="360" height="360"/>
    <rect x="569" y="190" width="360" height="360"/>
    <rect x="1056" y="190" width="360" height="360"/>
  </g>
  <g stroke="#E3E9EB" stroke-width="1">
    <!-- painel 1 -->
    <line x1="142" y1="190" x2="142" y2="550"/><line x1="202" y1="190" x2="202" y2="550"/>
    <line x1="322" y1="190" x2="322" y2="550"/><line x1="382" y1="190" x2="382" y2="550"/>
    <line x1="82" y1="250" x2="442" y2="250"/><line x1="82" y1="310" x2="442" y2="310"/>
    <line x1="82" y1="430" x2="442" y2="430"/><line x1="82" y1="490" x2="442" y2="490"/>
    <!-- painel 2 -->
    <line x1="629" y1="190" x2="629" y2="550"/><line x1="689" y1="190" x2="689" y2="550"/>
    <line x1="809" y1="190" x2="809" y2="550"/><line x1="869" y1="190" x2="869" y2="550"/>
    <line x1="569" y1="250" x2="929" y2="250"/><line x1="569" y1="310" x2="929" y2="310"/>
    <line x1="569" y1="430" x2="929" y2="430"/><line x1="569" y1="490" x2="929" y2="490"/>
    <!-- painel 3 -->
    <line x1="1116" y1="190" x2="1116" y2="550"/><line x1="1176" y1="190" x2="1176" y2="550"/>
    <line x1="1296" y1="190" x2="1296" y2="550"/><line x1="1356" y1="190" x2="1356" y2="550"/>
    <line x1="1056" y1="250" x2="1416" y2="250"/><line x1="1056" y1="310" x2="1416" y2="310"/>
    <line x1="1056" y1="430" x2="1416" y2="430"/><line x1="1056" y1="490" x2="1416" y2="490"/>
  </g>

  <!-- Eixos -->
  <g stroke="#263238" stroke-width="1.6" fill="none">
    <line x1="92" y1="370" x2="432" y2="370"/>
    <line x1="262" y1="540" x2="262" y2="200"/>
    <line x1="579" y1="370" x2="919" y2="370"/>
    <line x1="749" y1="540" x2="749" y2="200"/>
    <line x1="1066" y1="370" x2="1406" y2="370"/>
    <line x1="1236" y1="540" x2="1236" y2="200"/>
  </g>
  <g fill="#263238">
    <path d="M432 370 L421 364 L421 376 Z"/><path d="M262 200 L256 211 L268 211 Z"/>
    <path d="M919 370 L908 364 L908 376 Z"/><path d="M749 200 L743 211 L755 211 Z"/>
    <path d="M1406 370 L1395 364 L1395 376 Z"/><path d="M1236 200 L1230 211 L1242 211 Z"/>
  </g>
  <g class="axis-label">
    <text x="426" y="391">m_x</text><text x="273" y="211">m_y</text>
    <text x="913" y="391">m_x</text><text x="760" y="211">m_y</text>
    <text x="1400" y="391">m_x</text><text x="1247" y="211">m_y</text>
  </g>
  <g class="origin">
    <text x="250" y="387">0</text>
    <text x="737" y="387">0</text>
    <text x="1224" y="387">0</text>
  </g>

  <!-- 1: nuvem ideal -->
  <circle cx="262" cy="370" r="120" fill="none" stroke="#1565C0" stroke-width="1.7"
          stroke-dasharray="5 5" opacity="0.75"/>
  <g transform="translate(262 370)" fill="#1565C0" stroke="#FFFFFF" stroke-width="1.5">
    <use xlink:href="#cloudCircle"/>
  </g>
  <circle cx="262" cy="370" r="6.5" fill="#FFFFFF" stroke="#263238" stroke-width="2"/>
  <line x1="269" y1="365" x2="323" y2="330" stroke="#263238" stroke-width="1.2"/>
  <text x="329" y="327" class="label">centro na origem</text>

  <!-- 2: translação por hard-iron -->
  <circle cx="799" cy="329" r="120" fill="none" stroke="#F9A825" stroke-width="1.7"
          stroke-dasharray="5 5" opacity="0.8"/>
  <g transform="translate(799 329)" fill="#F9A825" stroke="#FFFFFF" stroke-width="1.5">
    <use xlink:href="#cloudCircle"/>
  </g>
  <path d="M799 321 L807 329 L799 337 L791 329 Z"
        fill="#FFFFFF" stroke="#263238" stroke-width="2"/>

  <line x1="749" y1="370" x2="799" y2="370" stroke="#F9A825" stroke-width="2.1"/>
  <path d="M749 370 L759 364 L759 376 Z M799 370 L789 364 L789 376 Z" fill="#F9A825"/>
  <line x1="799" y1="370" x2="799" y2="329" stroke="#F9A825" stroke-width="2.1"/>
  <path d="M799 370 L793 360 L805 360 Z M799 329 L793 339 L805 339 Z" fill="#F9A825"/>
  <text x="774" y="390" text-anchor="middle" class="label">offset x</text>
  <text x="811" y="352" class="label">offset y</text>
  <line x1="804" y1="323" x2="844" y2="286" stroke="#263238" stroke-width="1.2"/>
  <text x="849" y="282" class="label">centro estimado</text>

  <!-- 3: elipse medida, deslocada e rotacionada -->
  <g transform="matrix(0.9135 -0.4067 0.4067 0.9135 1287 331)">
    <ellipse cx="0" cy="0" rx="123" ry="72" fill="none" stroke="#F9A825"
             stroke-width="1.8" stroke-dasharray="5 5" opacity="0.9"/>
    <g fill="#F9A825" stroke="#FFFFFF" stroke-width="1.5">
      <use xlink:href="#cloudEllipse"/>
    </g>
    <line x1="-95" y1="0" x2="95" y2="0" stroke="#F9A825" stroke-width="1.8"/>
    <path d="M-95 0 L-84 -6 L-84 6 Z M95 0 L84 -6 L84 6 Z" fill="#F9A825"/>
    <line x1="0" y1="-48" x2="0" y2="48" stroke="#F9A825" stroke-width="1.8"/>
    <path d="M0 -48 L-6 -37 L6 -37 Z M0 48 L-6 37 L6 37 Z" fill="#F9A825"/>
  </g>
  <path d="M1287 323 L1295 331 L1287 339 L1279 331 Z"
        fill="#FFFFFF" stroke="#263238" stroke-width="2"/>
  <line x1="1293" y1="326" x2="1342" y2="278" stroke="#263238" stroke-width="1.2"/>
  <text x="1347" y="273" class="label">centro estimado</text>
  <line x1="1347" y1="435" x2="1371" y2="465" stroke="#F9A825" stroke-width="1.4"/>
  <text x="1378" y="469" text-anchor="end" class="label">escalas distintas</text>

  <!-- Resultado corrigido, no mesmo plano -->
  <circle cx="1236" cy="370" r="116" fill="none" stroke="#00796B" stroke-width="2.2"
          stroke-dasharray="8 5"/>
  <g transform="translate(1236 370) scale(0.97)"
     fill="#FFFFFF" stroke="#00796B" stroke-width="2.5">
    <use xlink:href="#cloudCircle"/>
  </g>
  <circle cx="1236" cy="370" r="6.5" fill="#FFFFFF" stroke="#00796B" stroke-width="2.3"/>

  <!-- Sequência medida -> corrigida -->
  <circle cx="1102" cy="604" r="6" fill="#F9A825"/>
  <text x="1115" y="609" class="label">medida</text>
  <line x1="1173" y1="604" x2="1302" y2="604" stroke="#00796B" stroke-width="2.3"/>
  <path d="M1302 604 L1291 598 L1291 610 Z" fill="#00796B"/>
  <text x="1237" y="593" text-anchor="middle" class="small">correção diagonal</text>
  <circle cx="1324" cy="604" r="6" fill="#FFFFFF" stroke="#00796B" stroke-width="2.4"/>
  <text x="1338" y="609" class="label">corrigida</text>

  <!-- Legenda -->
  <line x1="73" y1="633" x2="105" y2="633" stroke="#1565C0" stroke-width="3"/>
  <circle cx="89" cy="633" r="4.5" fill="#1565C0"/>
  <text x="114" y="638" class="legend">ideal</text>
  <line x1="171" y1="633" x2="203" y2="633" stroke="#F9A825" stroke-width="3"/>
  <circle cx="187" cy="633" r="4.5" fill="#F9A825"/>
  <text x="212" y="638" class="legend">medida</text>
  <line x1="288" y1="633" x2="320" y2="633" stroke="#00796B" stroke-width="3"/>
  <circle cx="304" cy="633" r="4.5" fill="#FFFFFF" stroke="#00796B" stroke-width="2"/>
  <text x="329" y="638" class="legend">corrigida</text>
  <path d="M89 643 L96 650 L89 657 L82 650 Z"
        fill="#FFFFFF" stroke="#263238" stroke-width="1.7"/>
  <text x="105" y="655" class="legend">centro estimado</text>

  <!-- Limitação da correção diagonal -->
  <rect x="35" y="700" width="1430" height="112" rx="9" fill="#FFFFFF"
        stroke="#B8C1C5" stroke-width="1.3"/>
  <rect x="35" y="700" width="10" height="112" rx="5" fill="#F9A825"/>
  <text x="70" y="735" class="call-title">Correção diagonal</text>
  <text x="70" y="762" class="call-text">offsets + escalas independentes por eixo</text>
  <line x1="465" y1="750" x2="595" y2="750" stroke="#263238" stroke-width="1.8"/>
  <path d="M595 750 L584 744 L584 756 Z" fill="#263238"/>
  <text x="635" y="735" class="call-title">Limitação</text>
  <text x="635" y="762" class="call-text">não remove acoplamentos ou rotações entre eixos</text>
  <line x1="1092" y1="750" x2="1178" y2="750" stroke="#263238" stroke-width="1.8"/>
  <path d="M1178 750 L1167 744 L1167 756 Z" fill="#263238"/>
  <text x="1217" y="735" class="call-title">Matriz completa</text>
  <text x="1217" y="762" class="call-text">inclui termos cruzados</text>
  <text x="70" y="792" class="small">modelo simplificado</text>
  <text x="1217" y="792" class="small">modelo geral</text>

</svg>
