<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 950" width="1500" height="950"
     font-family="DejaVu Sans, Liberation Sans, sans-serif" role="img"
     aria-label="Figura conceitual em dois painéis. O painel elétrico mostra uma linha SDA com resistor de pull-up para 3,3 volts, capacitância equivalente e dois dispositivos com transistores open-drain para forçar nível baixo. O painel temporal mostra a subida exponencial RC após a liberação e o efeito qualitativo de resistência de pull-up ou capacitância de barramento elevadas.">
  <defs>
    <marker id="arrowGraphite" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#263238"/>
    </marker>
    <marker id="arrowTeal" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#00796B"/>
    </marker>
    <marker id="arrowBlue" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#1565C0"/>
    </marker>
    <marker id="arrowAmber" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#F9A825"/>
    </marker>
    <marker id="arrowAmberStart" markerWidth="9" markerHeight="9" refX="0.5" refY="4.5" orient="auto">
      <path d="M8,0 L0,4.5 L8,9 Z" fill="#F9A825"/>
    </marker>
    <style>
      .title      { font-size: 33.75px; font-weight: 700; fill: #263238; }
      .subtitle   { font-size: 18.90px; font-style: italic; fill: #607178; }
      .panel      { font-size: 24.30px; font-weight: 700; fill: #263238; }
      .panel-sub  { font-size: 17.55px; fill: #607178; }
      .label      { font-size: 18.90px; fill: #263238; }
      .label-bold { font-size: 18.90px; font-weight: 700; fill: #263238; }
      .small      { font-size: 16.20px; fill: #607178; }
      .small-bold { font-size: 16.20px; font-weight: 700; }
      .state      { font-size: 20.25px; font-weight: 700; }
      .axis       { font-size: 16.20px; fill: #607178; }
      .legend     { font-size: 16.20px; fill: #263238; }
      .source     { font-size: 16.20px; font-style: italic; fill: #607178; }
    </style>
  </defs>

  <rect x="0" y="0" width="1500" height="950" fill="#FFFFFF"/>

  <text x="750" y="42" text-anchor="middle" class="title">Linha I²C open-drain e subida determinada pelo circuito RC</text>
  <text x="750" y="69" text-anchor="middle" class="subtitle">figura conceitual — uma linha SDA genérica, sem valores ou dimensões do protótipo</text>

  <!-- Painéis -->
  <rect x="35" y="105" width="690" height="800" rx="9" fill="#FEFAF4"
        stroke="#B8C1C5" stroke-width="1.54" stroke-dasharray="7 5"/>
  <rect x="755" y="105" width="710" height="800" rx="9" fill="#F5FAFB"
        stroke="#B8C1C5" stroke-width="1.54" stroke-dasharray="7 5"/>

  <!-- ================= PAINEL A: ELÉTRICO ================= -->
  <text x="65" y="140" class="panel">A  Painel elétrico</text>
  <text x="65" y="164" class="panel-sub">linha compartilhada com saídas que apenas drenam corrente</text>

  <!-- Alimentação e resistor de pull-up -->
  <line x1="370" y1="188" x2="410" y2="188" stroke="#263238" stroke-width="2.53"/>
  <line x1="390" y1="188" x2="390" y2="202" stroke="#263238" stroke-width="2.53"/>
  <text x="420" y="193" class="label-bold">3,3 V</text>
  <path d="M390 202 V211 L379 219 L401 231 L379 243 L401 255 L379 267 L401 279 L390 287 V300"
        fill="none" stroke="#263238" stroke-width="2.64" stroke-linejoin="round"/>
  <text x="414" y="251" class="label" font-style="italic">R_pull-up</text>

  <!-- Linha SDA -->
  <line x1="95" y1="300" x2="670" y2="300" stroke="#1565C0" stroke-width="3.52"/>
  <circle cx="210" cy="300" r="5" fill="#1565C0"/>
  <circle cx="465" cy="300" r="5" fill="#1565C0"/>
  <circle cx="595" cy="300" r="5" fill="#1565C0"/>
  <circle cx="390" cy="300" r="5" fill="#1565C0"/>
  <text x="95" y="286" class="label-bold" fill="#1565C0">SDA</text>
  <text x="670" y="286" text-anchor="end" class="small">linha compartilhada</text>

  <!-- Capacitância equivalente do barramento -->
  <line x1="595" y1="300" x2="595" y2="348" stroke="#263238" stroke-width="2.20"/>
  <line x1="574" y1="348" x2="616" y2="348" stroke="#263238" stroke-width="2.64"/>
  <line x1="574" y1="363" x2="616" y2="363" stroke="#263238" stroke-width="2.64"/>
  <line x1="595" y1="363" x2="595" y2="392" stroke="#263238" stroke-width="2.20"/>
  <line x1="579" y1="392" x2="611" y2="392" stroke="#263238" stroke-width="2.20"/>
  <line x1="584" y1="399" x2="606" y2="399" stroke="#263238" stroke-width="2.20"/>
  <line x1="590" y1="406" x2="600" y2="406" stroke="#263238" stroke-width="2.20"/>
  <text x="622" y="351" class="label" font-style="italic">C_bus</text>
  <text x="622" y="369" class="small">equivalente</text>

  <!-- Dispositivo 1 -->
  <rect x="120" y="335" width="180" height="180" rx="7" fill="#FFFFFF"
        stroke="#B8C1C5" stroke-width="1.54"/>
  <text x="210" y="360" text-anchor="middle" class="label-bold">Dispositivo 1</text>
  <line x1="210" y1="300" x2="210" y2="388" stroke="#263238" stroke-width="2.31"/>
  <line x1="210" y1="388" x2="210" y2="405" stroke="#263238" stroke-width="2.31"/>
  <line x1="210" y1="405" x2="210" y2="447" stroke="#263238" stroke-width="3.52"/>
  <line x1="179" y1="426" x2="197" y2="426" stroke="#263238" stroke-width="2.20"/>
  <line x1="197" y1="407" x2="197" y2="445" stroke="#263238" stroke-width="2.20"/>
  <line x1="210" y1="447" x2="210" y2="466" stroke="#263238" stroke-width="2.31"/>
  <line x1="194" y1="466" x2="226" y2="466" stroke="#263238" stroke-width="2.20"/>
  <line x1="199" y1="473" x2="221" y2="473" stroke="#263238" stroke-width="2.20"/>
  <line x1="205" y1="480" x2="215" y2="480" stroke="#263238" stroke-width="2.20"/>
  <text x="171" y="418" text-anchor="end" class="small">controle</text>
  <text x="222" y="418" class="small-bold" fill="#00796B">Q_OD1</text>
  <text x="210" y="502" text-anchor="middle" class="small">apenas força nível baixo</text>

  <!-- Dispositivo 2 -->
  <rect x="375" y="335" width="180" height="180" rx="7" fill="#FFFFFF"
        stroke="#B8C1C5" stroke-width="1.54"/>
  <text x="465" y="360" text-anchor="middle" class="label-bold">Dispositivo 2</text>
  <line x1="465" y1="300" x2="465" y2="388" stroke="#263238" stroke-width="2.31"/>
  <line x1="465" y1="388" x2="465" y2="405" stroke="#263238" stroke-width="2.31"/>
  <line x1="465" y1="405" x2="465" y2="447" stroke="#263238" stroke-width="3.52"/>
  <line x1="434" y1="426" x2="452" y2="426" stroke="#263238" stroke-width="2.20"/>
  <line x1="452" y1="407" x2="452" y2="445" stroke="#263238" stroke-width="2.20"/>
  <line x1="465" y1="447" x2="465" y2="466" stroke="#263238" stroke-width="2.31"/>
  <line x1="449" y1="466" x2="481" y2="466" stroke="#263238" stroke-width="2.20"/>
  <line x1="454" y1="473" x2="476" y2="473" stroke="#263238" stroke-width="2.20"/>
  <line x1="460" y1="480" x2="470" y2="480" stroke="#263238" stroke-width="2.20"/>
  <text x="426" y="418" text-anchor="end" class="small">controle</text>
  <text x="477" y="418" class="small-bold" fill="#00796B">Q_OD2</text>
  <text x="465" y="502" text-anchor="middle" class="small">apenas força nível baixo</text>

  <!-- Estados elétricos -->
  <rect x="78" y="548" width="290" height="112" rx="7" fill="#EDF7F5"
        stroke="#00796B" stroke-width="1.76"/>
  <text x="98" y="574" class="small-bold" fill="#00796B">ESTADO BAIXO</text>
  <line x1="112" y1="586" x2="112" y2="633" stroke="#00796B" stroke-width="3.30"
        marker-end="url(#arrowTeal)"/>
  <text x="230" y="600" text-anchor="middle" class="state" fill="#00796B" style="font-size:19px">qualquer dispositivo</text>
  <text x="230" y="628" text-anchor="middle" class="label-bold">conduz → SDA baixo</text>

  <rect x="390" y="548" width="290" height="112" rx="7" fill="#EEF4FB"
        stroke="#1565C0" stroke-width="1.76"/>
  <text x="410" y="574" class="small-bold" fill="#1565C0">ESTADO ALTO</text>
  <line x1="432" y1="633" x2="432" y2="585" stroke="#1565C0" stroke-width="3.30"
        marker-end="url(#arrowBlue)"/>
  <text x="470" y="600" class="state" fill="#1565C0">todos liberam</text>
  <text x="470" y="628" class="label-bold">SDA sobe pelo pull-up</text>

  <!-- Legenda elétrica -->
  <line x1="78" y1="696" x2="112" y2="696" stroke="#00796B" stroke-width="3.30"
        marker-end="url(#arrowTeal)"/>
  <text x="126" y="701" class="legend">corrente drenada ao GND</text>
  <line x1="330" y1="696" x2="365" y2="696" stroke="#1565C0" stroke-width="3.30"
        marker-end="url(#arrowBlue)"/>
  <text x="376" y="701" class="legend">subida passiva pelo pull-up</text>

  <!-- ================= PAINEL B: TEMPORAL ================= -->
  <text x="785" y="140" class="panel">B  Painel temporal</text>
  <text x="785" y="164" class="panel-sub">subida RC após a liberação da linha</text>

  <!-- Fórmula conceitual -->
  <rect x="1145" y="126" width="285" height="48" rx="6" fill="#FFFFFF"
        stroke="#1565C0" stroke-width="1.43"/>
  <text x="1287.5" y="156" text-anchor="middle" class="label-bold" fill="#1565C0">τ = R_pull-up × C_bus</text>

  <!-- Eixos -->
  <line x1="825" y1="510" x2="1425" y2="510" stroke="#263238" stroke-width="1.98"
        marker-end="url(#arrowGraphite)"/>
  <line x1="825" y1="510" x2="825" y2="188" stroke="#263238" stroke-width="1.98"
        marker-end="url(#arrowGraphite)"/>
  <text x="1432" y="528" class="axis">tempo</text>
  <text x="800" y="194" class="axis">V_SDA</text>
  <text x="812" y="514" text-anchor="end" class="axis">baixo</text>
  <text x="812" y="210" text-anchor="end" class="axis">alto</text>

  <!-- Referências horizontais -->
  <line x1="825" y1="206" x2="1410" y2="206" stroke="#B8C1C5" stroke-width="1.32"
        stroke-dasharray="6 5"/>
  <line x1="825" y1="302" x2="1410" y2="302" stroke="#263238" stroke-width="1.54"
        stroke-dasharray="7 5"/>
  <text x="1405" y="294" text-anchor="end" class="small-bold" fill="#263238">limiar lógico</text>

  <!-- Instante de liberação -->
  <line x1="900" y1="192" x2="900" y2="510" stroke="#607178" stroke-width="1.54"
        stroke-dasharray="5 5"/>
  <circle cx="900" cy="510" r="5" fill="#263238"/>
  <text x="900" y="552" text-anchor="middle" class="small-bold" fill="#263238">liberação</text>

  <!-- Curva de subida RC de referência -->
  <path d="M825 510 H900 C920 420 960 318 1015 260 C1080 220 1180 208 1405 206"
        fill="none" stroke="#1565C0" stroke-width="4.40"/>
  <text x="1100" y="238" class="small-bold" fill="#1565C0">subida RC</text>

  <!-- Curva qualitativamente mais lenta para produto RC maior -->
  <path d="M825 510 H900 C950 482 1015 420 1090 348 C1180 274 1295 224 1405 209"
        fill="none" stroke="#F9A825" stroke-width="3.30" stroke-dasharray="9 6"/>
  <text x="1205" y="355" class="small-bold" fill="#9A6500">R·C maior</text>

  <!-- Indicação conceitual do tempo de subida -->
  <line x1="938" y1="392" x2="938" y2="540" stroke="#B8C1C5" stroke-width="1.32"
        stroke-dasharray="4 4"/>
  <line x1="985" y1="292" x2="985" y2="540" stroke="#B8C1C5" stroke-width="1.32"
        stroke-dasharray="4 4"/>
  <line x1="942" y1="532" x2="981" y2="532" stroke="#F9A825" stroke-width="2.42"
        marker-start="url(#arrowAmberStart)" marker-end="url(#arrowAmber)"/>
  <text x="961.5" y="566" text-anchor="middle" class="small-bold" fill="#9A6500">tempo de subida t_r</text>

  <!-- Comparação qualitativa -->
  <rect x="790" y="590" width="230" height="72" rx="7" fill="#FFFFFF"
        stroke="#F9A825" stroke-width="1.65"/>
  <text x="905" y="616" text-anchor="middle" class="small-bold" fill="#9A6500">R_pull-up excessivo</text>
  <text x="905" y="642" text-anchor="middle" class="label-bold" fill="#9A6500">τ aumenta</text>

  <rect x="790" y="700" width="230" height="72" rx="7" fill="#FFFFFF"
        stroke="#00796B" stroke-width="1.65"/>
  <text x="905" y="726" text-anchor="middle" class="small-bold" fill="#00796B">C_bus elevada</text>
  <text x="905" y="752" text-anchor="middle" class="label-bold" fill="#00796B">τ aumenta</text>

  <rect x="1180" y="645" width="250" height="72" rx="7" fill="#EDF4F6"
        stroke="#1565C0" stroke-width="1.65"/>
  <text x="1305" y="671" text-anchor="middle" class="small-bold" fill="#1565C0">efeito comum</text>
  <text x="1305" y="697" text-anchor="middle" class="label-bold" fill="#1565C0">subida mais lenta</text>

  <path d="M1020 626 H1090 V670 H1170" fill="none"
        stroke="#F9A825" stroke-width="1.98" marker-end="url(#arrowAmber)"/>
  <path d="M1020 736 H1090 V692 H1170" fill="none" stroke="#00796B" stroke-width="1.98"
        marker-end="url(#arrowTeal)"/>

  <!-- Legenda temporal -->
  <line x1="790" y1="830" x2="835" y2="830" stroke="#1565C0" stroke-width="4.40"/>
  <text x="848" y="835" class="legend">subida de referência</text>
  <line x1="1030" y1="830" x2="1075" y2="830" stroke="#F9A825" stroke-width="3.30"
        stroke-dasharray="9 6"/>
  <text x="1088" y="835" class="legend">subida com R·C maior</text>
  <line x1="1295" y1="830" x2="1335" y2="830" stroke="#263238" stroke-width="1.54"
        stroke-dasharray="7 5"/>
  <text x="1348" y="835" class="legend">limiar</text>

</svg>
