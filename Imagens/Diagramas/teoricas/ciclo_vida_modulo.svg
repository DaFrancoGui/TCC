<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1420 1280" width="1420" height="1280" font-family="DejaVu Sans" role="img" aria-label="Fluxograma do ciclo de vida de um modulo. Fase 1, executada uma vez no boot: o nucleo chama a inicializacao do modulo, uma decisao verifica se o hardware respondeu; no caminho de sucesso o modulo e marcado como disponivel e a tarefa de aquisicao e criada quando aplicavel; no caminho de falha o modulo e marcado como indisponivel e nenhuma tarefa e criada; em ambos o nucleo prossegue para os demais modulos. Fase 2, executada uma vez: a tela e criada e sua funcao de atualizacao e registrada. Fase 3, repetida: a interface abre a tela ja existente e mostra os dados publicados ou a mensagem de sensor indisponivel, e o retorno ao menu preserva a tela criada; em paralelo, a tarefa de aquisicao le o sensor apenas enquanto a tela do modulo esta ativa">
  <style>
    .title   { font-size: 20px; fill: #2B3138; font-weight: bold; }
    .subtitle{ font-size: 11.5px; fill: #767D85; font-style: italic; }
    .band    { font-size: 12.5px; fill: #14515E; font-weight: bold; }
    .grouptl { font-size: 12.5px; fill: #2B3138; font-weight: bold; }
    .box     { font-size: 11.5px; fill: #2B3138; }
    .boxb    { font-size: 11.5px; fill: #14515E; font-weight: bold; }
    .dec     { font-size: 11.5px; fill: #2B3138; font-weight: bold; }
    .edge    { font-size: 10px; fill: #767D85; font-style: italic; }
    .edgeb   { font-size: 10.5px; fill: #14515E; font-weight: bold; }
    .edgea   { font-size: 10.5px; fill: #8A5510; font-weight: bold; }
    .note    { font-size: 9.5px; fill: #767D85; font-style: italic; }
    .leg     { font-size: 10.5px; fill: #2B3138; }
  </style>

  <rect x="0" y="0" width="1420" height="1280" fill="#FFFFFF"/>

  <text x="710" y="40" text-anchor="middle" class="title">Ciclo de vida de um módulo da plataforma</text>
  <text x="710" y="62" text-anchor="middle" class="subtitle">arquitetura implementada — composição explícita dos módulos pelo núcleo</text>

  <!-- ================================================================== -->
  <!-- FASE 1                                                             -->
  <!-- ================================================================== -->
  <rect x="30" y="86" width="1360" height="446" rx="8" fill="#FCFCFC" stroke="#B8BDC3" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="52" y="112" class="band">1 · Inicialização — executada uma vez, no boot</text>

  <rect x="430" y="130" width="380" height="46" rx="6" fill="#DCEBEE" stroke="#1D7A8C" stroke-width="1.8"/>
  <text x="620" y="159" text-anchor="middle" class="boxb">Núcleo chama a inicialização do módulo</text>

  <line x1="620" y1="176" x2="620" y2="186" stroke="#1D7A8C" stroke-width="1.8"/>
  <polygon points="614,186 626,186 620,196" fill="#1D7A8C"/>

  <polygon points="620,196 770,240 620,284 470,240" fill="#FFFFFF" stroke="#1D7A8C" stroke-width="1.8"/>
  <text x="620" y="244" text-anchor="middle" class="dec">o hardware respondeu?</text>

  <!-- ramo sucesso -->
  <line x1="470" y1="240" x2="300" y2="240" stroke="#1D7A8C" stroke-width="1.8"/>
  <line x1="300" y1="240" x2="300" y2="290" stroke="#1D7A8C" stroke-width="1.8"/>
  <polygon points="294,290 306,290 300,300" fill="#1D7A8C"/>
  <text x="386" y="232" text-anchor="middle" class="edgeb">sim</text>

  <rect x="140" y="300" width="320" height="46" rx="6" fill="#EDF4F6" stroke="#1D7A8C" stroke-width="1.6"/>
  <text x="300" y="329" text-anchor="middle" class="box">marca o módulo como disponível</text>

  <line x1="300" y1="346" x2="300" y2="356" stroke="#1D7A8C" stroke-width="1.8"/>
  <polygon points="294,356 306,356 300,366" fill="#1D7A8C"/>

  <rect x="140" y="366" width="320" height="62" rx="6" fill="#EDF4F6" stroke="#1D7A8C" stroke-width="1.6"/>
  <text x="300" y="391" text-anchor="middle" class="box">cria a tarefa de aquisição</text>
  <text x="300" y="411" text-anchor="middle" class="box">(quando aplicável)</text>

  <!-- ramo falha -->
  <line x1="770" y1="240" x2="940" y2="240" stroke="#C97B1E" stroke-width="1.8"/>
  <line x1="940" y1="240" x2="940" y2="290" stroke="#C97B1E" stroke-width="1.8"/>
  <polygon points="934,290 946,290 940,300" fill="#C97B1E"/>
  <text x="854" y="232" text-anchor="middle" class="edgea">não</text>

  <rect x="780" y="300" width="320" height="46" rx="6" fill="#FDF4E7" stroke="#C97B1E" stroke-width="1.6"/>
  <text x="940" y="329" text-anchor="middle" class="box">marca o módulo como indisponível</text>

  <line x1="940" y1="346" x2="940" y2="356" stroke="#C97B1E" stroke-width="1.8"/>
  <polygon points="934,356 946,356 940,366" fill="#C97B1E"/>

  <rect x="780" y="366" width="320" height="62" rx="6" fill="#FDF4E7" stroke="#C97B1E" stroke-width="1.6"/>
  <text x="940" y="391" text-anchor="middle" class="box">não cria tarefa de aquisição;</text>
  <text x="940" y="411" text-anchor="middle" class="box">sem novas tentativas periódicas</text>

  <!-- convergencia -->
  <line x1="300" y1="428" x2="300" y2="448" stroke="#767D85" stroke-width="1.6"/>
  <line x1="940" y1="428" x2="940" y2="448" stroke="#767D85" stroke-width="1.6"/>
  <line x1="300" y1="448" x2="940" y2="448" stroke="#767D85" stroke-width="1.6"/>
  <line x1="620" y1="448" x2="620" y2="454" stroke="#767D85" stroke-width="1.6"/>
  <polygon points="614,454 626,454 620,464" fill="#767D85"/>

  <rect x="430" y="464" width="380" height="46" rx="6" fill="#F4F7F8" stroke="#767D85" stroke-width="1.6"/>
  <text x="620" y="493" text-anchor="middle" class="box">Núcleo prossegue para os demais módulos</text>

  <!-- ================================================================== -->
  <!-- FASE 2                                                             -->
  <!-- ================================================================== -->
  <line x1="620" y1="532" x2="620" y2="586" stroke="#1D7A8C" stroke-width="1.8"/>
  <polygon points="614,586 626,586 620,596" fill="#1D7A8C"/>

  <rect x="30" y="552" width="1360" height="168" rx="8" fill="#FCFCFC" stroke="#B8BDC3" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="52" y="578" class="band">2 · Criação da interface — executada uma vez, nos dois caminhos</text>

  <rect x="430" y="596" width="380" height="46" rx="6" fill="#EDF4F6" stroke="#1D7A8C" stroke-width="1.6"/>
  <text x="620" y="625" text-anchor="middle" class="box">Cria a tela — uma única vez</text>

  <line x1="620" y1="642" x2="620" y2="652" stroke="#1D7A8C" stroke-width="1.8"/>
  <polygon points="614,652 626,652 620,662" fill="#1D7A8C"/>

  <rect x="430" y="662" width="380" height="46" rx="6" fill="#EDF4F6" stroke="#1D7A8C" stroke-width="1.6"/>
  <text x="620" y="691" text-anchor="middle" class="box">Registra a tela e sua função de atualização</text>

  <!-- ================================================================== -->
  <!-- FASE 3                                                             -->
  <!-- ================================================================== -->
  <line x1="620" y1="720" x2="620" y2="752" stroke="#1D7A8C" stroke-width="1.8"/>
  <line x1="620" y1="752" x2="370" y2="752" stroke="#1D7A8C" stroke-width="1.8"/>
  <line x1="370" y1="752" x2="370" y2="806" stroke="#1D7A8C" stroke-width="1.8"/>
  <polygon points="364,806 376,806 370,816" fill="#1D7A8C"/>

  <rect x="30" y="740" width="1360" height="470" rx="8" fill="#FCFCFC" stroke="#B8BDC3" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="52" y="766" class="band">3 · Operação — repetida</text>

  <!-- grupo INTERFACE -->
  <rect x="40" y="778" width="660" height="420" rx="7" fill="#FFFFFF" stroke="#B8BDC3" stroke-width="1.3"/>
  <text x="58" y="800" class="grouptl">Interface — ciclo de vida</text>

  <rect x="210" y="816" width="320" height="46" rx="6" fill="#EDF4F6" stroke="#1D7A8C" stroke-width="1.6"/>
  <text x="370" y="845" text-anchor="middle" class="box">Abre a tela pelo menu</text>

  <line x1="370" y1="862" x2="370" y2="880" stroke="#1D7A8C" stroke-width="1.8"/>
  <polygon points="364,880 376,880 370,890" fill="#1D7A8C"/>
  <text x="386" y="878" class="edge">atualização da tela ativa, a cada 500 ms</text>

  <polygon points="370,890 510,932 370,974 230,932" fill="#FFFFFF" stroke="#1D7A8C" stroke-width="1.8"/>
  <text x="370" y="936" text-anchor="middle" class="dec">módulo disponível?</text>

  <line x1="510" y1="932" x2="535" y2="932" stroke="#1D7A8C" stroke-width="1.8"/>
  <line x1="535" y1="932" x2="535" y2="994" stroke="#1D7A8C" stroke-width="1.8"/>
  <polygon points="529,994 541,994 535,1004" fill="#1D7A8C"/>
  <text x="556" y="928" class="edgeb">sim</text>

  <line x1="230" y1="932" x2="205" y2="932" stroke="#C97B1E" stroke-width="1.8"/>
  <line x1="205" y1="932" x2="205" y2="994" stroke="#C97B1E" stroke-width="1.8"/>
  <polygon points="199,994 211,994 205,1004" fill="#C97B1E"/>
  <text x="184" y="928" text-anchor="end" class="edgea">não</text>

  <rect x="60" y="1004" width="290" height="62" rx="6" fill="#FDF4E7" stroke="#C97B1E" stroke-width="1.6"/>
  <text x="205" y="1029" text-anchor="middle" class="box">mostra a mensagem</text>
  <text x="205" y="1049" text-anchor="middle" class="box">“Sensor indisponivel”</text>

  <rect x="390" y="1004" width="290" height="62" rx="6" fill="#EDF4F6" stroke="#1D7A8C" stroke-width="1.6"/>
  <text x="535" y="1029" text-anchor="middle" class="box">mostra os dados</text>
  <text x="535" y="1049" text-anchor="middle" class="box">publicados pela tarefa</text>

  <line x1="205" y1="1066" x2="205" y2="1080" stroke="#767D85" stroke-width="1.6"/>
  <line x1="535" y1="1066" x2="535" y2="1080" stroke="#767D85" stroke-width="1.6"/>
  <line x1="205" y1="1080" x2="535" y2="1080" stroke="#767D85" stroke-width="1.6"/>
  <line x1="370" y1="1080" x2="370" y2="1086" stroke="#767D85" stroke-width="1.6"/>
  <polygon points="364,1086 376,1086 370,1096" fill="#767D85"/>

  <rect x="210" y="1096" width="320" height="62" rx="6" fill="#F4F7F8" stroke="#767D85" stroke-width="1.6"/>
  <text x="370" y="1121" text-anchor="middle" class="box">Volta ao menu: a tela permanece</text>
  <text x="370" y="1141" text-anchor="middle" class="box">criada; núcleo e demais módulos seguem</text>

  <line x1="370" y1="1158" x2="370" y2="1176" stroke="#1D7A8C" stroke-width="1.6"/>
  <line x1="370" y1="1176" x2="60" y2="1176" stroke="#1D7A8C" stroke-width="1.6"/>
  <line x1="60" y1="1176" x2="60" y2="839" stroke="#1D7A8C" stroke-width="1.6"/>
  <line x1="60" y1="839" x2="200" y2="839" stroke="#1D7A8C" stroke-width="1.6"/>
  <polygon points="200,833 200,845 210,839" fill="#1D7A8C"/>

  <!-- grupo AQUISICAO -->
  <rect x="720" y="778" width="640" height="420" rx="7" fill="#FFFFFF" stroke="#B8BDC3" stroke-width="1.3"/>
  <text x="738" y="800" class="grouptl">Aquisição — atividade</text>

  <text x="1040" y="818" text-anchor="middle" class="note">criada na fase 1, apenas no caminho “disponível”</text>

  <rect x="890" y="826" width="300" height="46" rx="6" fill="#EDF4F6" stroke="#1D7A8C" stroke-width="1.6"/>
  <text x="1040" y="855" text-anchor="middle" class="box">Tarefa de aquisição</text>

  <line x1="1040" y1="872" x2="1040" y2="880" stroke="#1D7A8C" stroke-width="1.8"/>
  <polygon points="1034,880 1046,880 1040,890" fill="#1D7A8C"/>

  <polygon points="1040,890 1200,932 1040,974 880,932" fill="#FFFFFF" stroke="#1D7A8C" stroke-width="1.8"/>
  <text x="1040" y="936" text-anchor="middle" class="dec">a tela do módulo está ativa?</text>

  <line x1="1040" y1="974" x2="1040" y2="990" stroke="#1D7A8C" stroke-width="1.8"/>
  <line x1="1040" y1="990" x2="965" y2="990" stroke="#1D7A8C" stroke-width="1.8"/>
  <line x1="965" y1="990" x2="965" y2="994" stroke="#1D7A8C" stroke-width="1.8"/>
  <polygon points="959,994 971,994 965,1004" fill="#1D7A8C"/>
  <text x="1052" y="990" class="edgeb">sim</text>

  <line x1="1200" y1="932" x2="1217" y2="932" stroke="#767D85" stroke-width="1.8"/>
  <line x1="1217" y1="932" x2="1217" y2="994" stroke="#767D85" stroke-width="1.8"/>
  <polygon points="1211,994 1223,994 1217,1004" fill="#767D85"/>
  <text x="1228" y="928" class="edge">não</text>

  <rect x="830" y="1004" width="270" height="62" rx="6" fill="#EDF4F6" stroke="#1D7A8C" stroke-width="1.6"/>
  <text x="965" y="1029" text-anchor="middle" class="box">lê o sensor e</text>
  <text x="965" y="1049" text-anchor="middle" class="box">publica o estado</text>

  <rect x="1115" y="1004" width="205" height="62" rx="6" fill="#F4F7F8" stroke="#767D85" stroke-width="1.6"/>
  <text x="1217" y="1029" text-anchor="middle" class="box">aguarda; não</text>
  <text x="1217" y="1049" text-anchor="middle" class="box">acessa o hardware</text>

  <!-- retorno do laco de aquisicao -->
  <line x1="965" y1="1066" x2="965" y2="1100" stroke="#1D7A8C" stroke-width="1.6"/>
  <line x1="1217" y1="1066" x2="1217" y2="1100" stroke="#767D85" stroke-width="1.6"/>
  <line x1="965" y1="1100" x2="1345" y2="1100" stroke="#1D7A8C" stroke-width="1.6"/>
  <line x1="1345" y1="1100" x2="1345" y2="883" stroke="#1D7A8C" stroke-width="1.6"/>
  <line x1="1345" y1="883" x2="1046" y2="883" stroke="#1D7A8C" stroke-width="1.6"/>
  <polygon points="1046,877 1046,889 1036,883" fill="#1D7A8C"/>

  <!-- estado publicado: tarefa -> tela -->
  <line x1="830" y1="1035" x2="694" y2="1035" stroke="#C97B1E" stroke-width="1.8" stroke-dasharray="7 4"/>
  <polygon points="694,1029 694,1041 684,1035" fill="#C97B1E"/>
  <text x="757" y="1024" text-anchor="middle" class="edgea">estado publicado</text>

  <!-- ================================================================== -->
  <!-- LEGENDA                                                            -->
  <!-- ================================================================== -->
  <line x1="30" y1="1234" x2="1390" y2="1234" stroke="#B8BDC3" stroke-width="1"/>

  <line x1="52" y1="1260" x2="88" y2="1260" stroke="#1D7A8C" stroke-width="1.8"/>
  <polygon points="87,1254 87,1266 98,1260" fill="#1D7A8C"/>
  <text x="110" y="1264" class="leg">fluxo de controle</text>

  <line x1="300" y1="1260" x2="336" y2="1260" stroke="#C97B1E" stroke-width="1.8"/>
  <polygon points="335,1254 335,1266 346,1260" fill="#C97B1E"/>
  <text x="358" y="1264" class="leg">caminho do sensor ausente</text>

  <line x1="620" y1="1260" x2="656" y2="1260" stroke="#C97B1E" stroke-width="1.8" stroke-dasharray="7 4"/>
  <polygon points="655,1254 655,1266 666,1260" fill="#C97B1E"/>
  <text x="678" y="1264" class="leg">estado publicado pela tarefa de aquisição</text>

  <line x1="1010" y1="1260" x2="1046" y2="1260" stroke="#767D85" stroke-width="1.6"/>
  <polygon points="1045,1254 1045,1266 1056,1260" fill="#767D85"/>
  <text x="1068" y="1264" class="leg">caminho comum aos dois casos</text>
</svg>
