<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" font-family="DejaVu Sans" role="img" aria-label="Figura conceitual em três faixas horizontais: no topo a aplicação demonstradora com seis módulos funcionais, ao centro a plataforma modular com contrato de módulos, núcleo de composição, serviços compartilhados e FreeRTOS, e na base o hardware com XIAO ESP32-C6, Round Display e sensores">
  <style>
    .title   { font-size: 19px; fill: #2B3138; font-weight: bold; }
    .subtitle{ font-size: 11.5px; fill: #767D85; font-style: italic; }
    .band    { font-size: 11.5px; fill: #767D85; font-weight: bold; letter-spacing: 1.2px; }
    .grouptl { font-size: 13.5px; font-weight: bold; }
    .boxtl   { font-size: 11.5px; fill: #2B3138; font-weight: bold; }
    .sub     { font-size: 9.5px; fill: #767D85; }
    .subm    { font-size: 10px; fill: #767D85; }
    .stereo  { font-size: 10px; fill: #767D85; font-style: italic; }
    .rel     { font-size: 10.5px; font-style: italic; }
    .leg     { font-size: 10.5px; fill: #2B3138; }
  </style>

  <rect x="0" y="0" width="1200" height="900" fill="#FFFFFF"/>

  <text x="600" y="38" text-anchor="middle" class="title">Plataforma modular e aplicação demonstradora</text>
  <text x="600" y="60" text-anchor="middle" class="subtitle">figura conceitual — a plataforma é a contribuição arquitetural reutilizável; a aplicação é a instanciação avaliada</text>

  <!-- ================= FAIXA 1 — APLICACAO ================= -->
  <rect x="96" y="84" width="1024" height="196" rx="8" fill="#FEFAF4" stroke="#B8BDC3" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text transform="rotate(-90 52 182)" x="52" y="182" text-anchor="middle" class="band">APLICAÇÃO</text>
  <text transform="rotate(-90 74 182)" x="74" y="182" text-anchor="middle" class="band">DEMONSTRADORA</text>

  <!-- aplicação demonstradora -->
  <rect x="116" y="104" width="824" height="156" rx="7" fill="#FDF4E7" stroke="#C97B1E" stroke-width="1.8"/>
  <text x="136" y="128" class="grouptl" fill="#A66311">Aplicação demonstradora</text>
  <text x="136" y="145" class="subm">uma instanciação da plataforma: seis módulos funcionais e suas telas</text>

  <!-- modulos -->
  <g>
    <rect x="132" y="154" width="118" height="92" rx="5" fill="#FFFFFF" stroke="#C97B1E" stroke-width="1.3"/>
    <text x="191" y="182" text-anchor="middle" class="boxtl">Relógio</text>
    <text x="191" y="201" text-anchor="middle" class="sub">tela principal</text>
    <text x="191" y="217" text-anchor="middle" class="sub">RTC PCF8563</text>
    <text x="191" y="233" text-anchor="middle" class="sub">hora e data</text>

    <rect x="266" y="154" width="118" height="92" rx="5" fill="#FFFFFF" stroke="#C97B1E" stroke-width="1.3"/>
    <text x="325" y="182" text-anchor="middle" class="boxtl">Cardíaco</text>
    <text x="325" y="201" text-anchor="middle" class="sub">PPG</text>
    <text x="325" y="217" text-anchor="middle" class="sub">MAX30102</text>
    <text x="325" y="233" text-anchor="middle" class="sub">FC e SpO₂</text>

    <rect x="400" y="154" width="118" height="92" rx="5" fill="#FFFFFF" stroke="#C97B1E" stroke-width="1.3"/>
    <text x="459" y="182" text-anchor="middle" class="boxtl">Temperatura</text>
    <text x="459" y="201" text-anchor="middle" class="sub">termometria</text>
    <text x="459" y="217" text-anchor="middle" class="sub">DS18B20</text>
    <text x="459" y="233" text-anchor="middle" class="sub">graus Celsius</text>

    <rect x="534" y="154" width="118" height="92" rx="5" fill="#FFFFFF" stroke="#C97B1E" stroke-width="1.3"/>
    <text x="593" y="182" text-anchor="middle" class="boxtl">Luz e UV</text>
    <text x="593" y="201" text-anchor="middle" class="sub">ambiental</text>
    <text x="593" y="217" text-anchor="middle" class="sub">LTR390</text>
    <text x="593" y="233" text-anchor="middle" class="sub">lux e índice UV</text>

    <rect x="668" y="154" width="118" height="92" rx="5" fill="#FFFFFF" stroke="#C97B1E" stroke-width="1.3"/>
    <text x="727" y="182" text-anchor="middle" class="boxtl">Bússola</text>
    <text x="727" y="201" text-anchor="middle" class="sub">magnetometria</text>
    <text x="727" y="217" text-anchor="middle" class="sub">AK8963</text>
    <text x="727" y="233" text-anchor="middle" class="sub">rumo magnético</text>

    <rect x="802" y="154" width="118" height="92" rx="5" fill="#FFFFFF" stroke="#C97B1E" stroke-width="1.3"/>
    <text x="861" y="182" text-anchor="middle" class="boxtl">Pedômetro</text>
    <text x="861" y="201" text-anchor="middle" class="sub">inercial</text>
    <text x="861" y="217" text-anchor="middle" class="sub">MPU-9250</text>
    <text x="861" y="233" text-anchor="middle" class="sub">passos</text>
  </g>

  <!-- aplicação hipotética: a plataforma não se confunde com a instanciação avaliada -->
  <rect x="956" y="104" width="164" height="156" rx="7" fill="#FBFBFB" stroke="#B8BDC3" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="1038" y="140" text-anchor="middle" class="boxtl" fill="#767D85">Outra aplicação</text>
  <text x="1038" y="160" text-anchor="middle" class="sub">sobre a mesma</text>
  <text x="1038" y="176" text-anchor="middle" class="sub">plataforma, com</text>
  <text x="1038" y="192" text-anchor="middle" class="sub">outro conjunto</text>
  <text x="1038" y="208" text-anchor="middle" class="sub">de módulos</text>
  <text x="1038" y="232" text-anchor="middle" class="stereo">(fora do escopo)</text>

  <!-- ================= FAIXA 2 — PLATAFORMA ================= -->
  <rect x="96" y="320" width="1024" height="296" rx="8" fill="#F6FAFB" stroke="#B8BDC3" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text transform="rotate(-90 52 468)" x="52" y="468" text-anchor="middle" class="band">PLATAFORMA</text>
  <text transform="rotate(-90 74 468)" x="74" y="468" text-anchor="middle" class="band">MODULAR</text>

  <!-- contrato -->
  <rect x="116" y="344" width="824" height="62" rx="6" fill="#DCEBEE" stroke="#1D7A8C" stroke-width="2"/>
  <text x="136" y="371" class="grouptl" fill="#14515E">Contrato de módulos</text>
  <text x="136" y="391" class="subm">interface uniforme de inicialização, criação de tela e atualização periódica</text>
  <text x="924" y="371" text-anchor="end" class="stereo">«ponto de extensão»</text>

  <!-- nucleo -->
  <rect x="116" y="424" width="824" height="60" rx="6" fill="#EDF4F6" stroke="#1D7A8C" stroke-width="1.6"/>
  <text x="136" y="450" class="grouptl" fill="#14515E">Núcleo de composição</text>
  <text x="136" y="469" class="subm">registro de telas, navegação, ciclo de vida e inicialização não fatal</text>

  <!-- servicos -->
  <text x="116" y="508" class="boxtl">Serviços compartilhados</text>
  <g>
    <rect x="116" y="516" width="264" height="78" rx="6" fill="#EDF4F6" stroke="#1D7A8C" stroke-width="1.6"/>
    <text x="248" y="542" text-anchor="middle" class="boxtl" fill="#14515E">Barramento I²C</text>
    <text x="248" y="561" text-anchor="middle" class="sub">exclusão mútua entre módulos</text>
    <text x="248" y="577" text-anchor="middle" class="sub">e recuperação do barramento</text>

    <rect x="396" y="516" width="264" height="78" rx="6" fill="#EDF4F6" stroke="#1D7A8C" stroke-width="1.6"/>
    <text x="528" y="542" text-anchor="middle" class="boxtl" fill="#14515E">Interface gráfica</text>
    <text x="528" y="561" text-anchor="middle" class="sub">LVGL e sua porta para o ESP-IDF</text>
    <text x="528" y="577" text-anchor="middle" class="sub">telas, toque e desenho</text>

    <rect x="676" y="516" width="264" height="78" rx="6" fill="#EDF4F6" stroke="#1D7A8C" stroke-width="1.6"/>
    <text x="808" y="542" text-anchor="middle" class="boxtl" fill="#14515E">Persistência (NVS)</text>
    <text x="808" y="561" text-anchor="middle" class="sub">parâmetros e calibração</text>
    <text x="808" y="577" text-anchor="middle" class="sub">preservados entre execuções</text>
  </g>

  <!-- freertos -->
  <rect x="956" y="344" width="164" height="250" rx="6" fill="#EDF4F6" stroke="#1D7A8C" stroke-width="1.6"/>
  <text x="1038" y="408" text-anchor="middle" class="boxtl" fill="#14515E">FreeRTOS</text>
  <text x="1038" y="427" text-anchor="middle" class="sub">ESP-IDF</text>
  <text x="1038" y="475" text-anchor="middle" class="sub">tarefas</text>
  <text x="1038" y="493" text-anchor="middle" class="sub">prioridades</text>
  <text x="1038" y="511" text-anchor="middle" class="sub">sincronização</text>
  <text x="1038" y="550" text-anchor="middle" class="sub">base de execução</text>
  <text x="1038" y="568" text-anchor="middle" class="sub">da plataforma</text>

  <!-- ================= FAIXA 3 — HARDWARE ================= -->
  <rect x="96" y="656" width="1024" height="150" rx="8" fill="#F6F7F7" stroke="#B8BDC3" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text transform="rotate(-90 63 731)" x="63" y="731" text-anchor="middle" class="band">HARDWARE</text>

  <rect x="116" y="676" width="264" height="110" rx="6" fill="#FFFFFF" stroke="#767D85" stroke-width="1.5"/>
  <text x="248" y="706" text-anchor="middle" class="boxtl">XIAO ESP32-C6</text>
  <text x="248" y="726" text-anchor="middle" class="sub">microcontrolador RISC-V</text>
  <text x="248" y="744" text-anchor="middle" class="sub">memória, temporizadores e</text>
  <text x="248" y="760" text-anchor="middle" class="sub">periféricos de comunicação</text>

  <rect x="396" y="676" width="264" height="110" rx="6" fill="#FFFFFF" stroke="#767D85" stroke-width="1.5"/>
  <text x="528" y="706" text-anchor="middle" class="boxtl">Round Display</text>
  <text x="528" y="726" text-anchor="middle" class="sub">tela circular</text>
  <text x="528" y="744" text-anchor="middle" class="sub">e toque capacitivo</text>

  <rect x="676" y="676" width="264" height="110" rx="6" fill="#FFFFFF" stroke="#767D85" stroke-width="1.5"/>
  <text x="808" y="706" text-anchor="middle" class="boxtl">Sensores e relógio</text>
  <text x="808" y="726" text-anchor="middle" class="sub">MAX30102 · DS18B20 · LTR390</text>
  <text x="808" y="744" text-anchor="middle" class="sub">MPU-9250/AK8963 · PCF8563</text>

  <rect x="956" y="676" width="164" height="110" rx="6" fill="#FFFFFF" stroke="#767D85" stroke-width="1.5"/>
  <text x="1038" y="706" text-anchor="middle" class="boxtl">Alimentação</text>
  <text x="1038" y="726" text-anchor="middle" class="boxtl">e bateria</text>
  <text x="1038" y="750" text-anchor="middle" class="sub">USB ou LiPo</text>
  <text x="1038" y="768" text-anchor="middle" class="sub">leitura por ADC</text>

  <!-- ===== SETAS DE INTEGRACAO (aplicacao -> contrato) ===== -->
  <g stroke="#C97B1E" stroke-width="1.8">
    <line x1="191" y1="248" x2="191" y2="334"/>
    <line x1="325" y1="248" x2="325" y2="334"/>
    <line x1="459" y1="248" x2="459" y2="334"/>
    <line x1="593" y1="248" x2="593" y2="334"/>
    <line x1="727" y1="248" x2="727" y2="334"/>
    <line x1="861" y1="248" x2="861" y2="334"/>
  </g>
  <g fill="#C97B1E">
    <polygon points="184,332 198,332 191,344"/>
    <polygon points="318,332 332,332 325,344"/>
    <polygon points="452,332 466,332 459,344"/>
    <polygon points="586,332 600,332 593,344"/>
    <polygon points="720,332 734,332 727,344"/>
    <polygon points="854,332 868,332 861,344"/>
  </g>
  <text x="952" y="302" class="rel" fill="#A66311">«integra»</text>

  <!-- ===== SETAS DE ACESSO (servicos -> hardware) ===== -->
  <g stroke="#2B3138" stroke-width="1.6" stroke-dasharray="7 4">
    <line x1="248" y1="598" x2="248" y2="664"/>
    <line x1="528" y1="598" x2="528" y2="664"/>
    <line x1="808" y1="598" x2="808" y2="664"/>
  </g>
  <g fill="none" stroke="#2B3138" stroke-width="1.8">
    <polyline points="240,664 248,676 256,664"/>
    <polyline points="520,664 528,676 536,664"/>
    <polyline points="800,664 808,676 816,664"/>
  </g>
  <text x="952" y="642" class="rel" fill="#2B3138">«acessa»</text>

  <!-- ================= LEGENDA ================= -->
  <line x1="96" y1="828" x2="1120" y2="828" stroke="#B8BDC3" stroke-width="1"/>

  <line x1="116" y1="852" x2="146" y2="852" stroke="#C97B1E" stroke-width="1.8"/>
  <polygon points="145,846 145,858 156,852" fill="#C97B1E"/>
  <text x="168" y="856" class="leg">integração: cada módulo da aplicação implementa o contrato da plataforma</text>

  <line x1="640" y1="852" x2="670" y2="852" stroke="#2B3138" stroke-width="1.6" stroke-dasharray="7 4"/>
  <polyline points="669,845 680,852 669,859" fill="none" stroke="#2B3138" stroke-width="1.8"/>
  <text x="692" y="856" class="leg">acesso: os serviços compartilhados operam os recursos de hardware</text>

  <rect x="116" y="872" width="36" height="14" rx="3" fill="#FBFBFB" stroke="#B8BDC3" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="164" y="883" class="leg">caixa tracejada: elemento hipotético, fora do escopo</text>
  <text x="1120" y="883" text-anchor="end" class="stereo">figura conceitual — sem escala, registradores ou pinos</text>
</svg>
