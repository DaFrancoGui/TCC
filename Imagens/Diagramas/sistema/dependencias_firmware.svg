<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 650" font-family="Helvetica" role="img" aria-label="Grafo de dependencias reais do firmware: nucleo compoe os modulos, modulos registram telas pelo contrato app.h, drivers I2C usam recuperacao compartilhada e pedometro reutiliza o driver MPU9250">
<rect width="1120" height="650" fill="#FFFFFF"/>
<defs>
  <marker id="ctl" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#1D7A8C"/></marker>
  <marker id="reg" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#5B6BA6"/></marker>
  <marker id="infra" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#C97B1E"/></marker>
  <style>
    .title{font-size:17px;font-weight:bold;fill:#2B3138}.head{font-size:13px;font-weight:bold;fill:#14515E}.body{font-size:10.5px;fill:#767D85}.small{font-size:9.5px;fill:#767D85}.box{fill:#EDF4F6;stroke:#1D7A8C;stroke-width:1.6}.module{fill:#FFFFFF;stroke:#B8BDC3;stroke-width:1.3}.service{fill:#FFF8EF;stroke:#C97B1E;stroke-width:1.5}.contract{fill:#F2F1FA;stroke:#5B6BA6;stroke-width:1.5}
  </style>
</defs>
<text x="560" y="32" text-anchor="middle" class="title">Dependências reais do firmware integrado</text>

<rect x="390" y="58" width="340" height="72" rx="8" class="box"/>
<text x="560" y="82" text-anchor="middle" class="head">Núcleo / composição em main.c</text>
<text x="560" y="101" text-anchor="middle" class="body">inclui cabeçalhos · inicializa módulos · cria telas · liga menus</text>
<text x="560" y="117" text-anchor="middle" class="small">ponto central explícito; não há descoberta dinâmica</text>

<rect x="420" y="164" width="280" height="60" rx="7" class="contract"/>
<text x="560" y="188" text-anchor="middle" class="head">Contrato e serviços app.h</text>
<text x="560" y="207" text-anchor="middle" class="body">register_screen · style_btn · perf_read</text>

<!-- módulos -->
<g>
<rect x="40" y="300" width="180" height="80" rx="7" class="module"/><text x="130" y="325" text-anchor="middle" class="head">MAX30102</text><text x="130" y="345" text-anchor="middle" class="body">hw · PPG · FC · SpO₂ · tela</text><text x="130" y="363" text-anchor="middle" class="small">I²C 0x57</text>
<rect x="255" y="300" width="180" height="80" rx="7" class="module"/><text x="345" y="325" text-anchor="middle" class="head">DS18B20</text><text x="345" y="345" text-anchor="middle" class="body">hw · processo · tela</text><text x="345" y="363" text-anchor="middle" class="small">1-Wire / RMT</text>
<rect x="470" y="300" width="180" height="80" rx="7" class="module"/><text x="560" y="325" text-anchor="middle" class="head">LTR390</text><text x="560" y="345" text-anchor="middle" class="body">hw · ALS/UVS · telas</text><text x="560" y="363" text-anchor="middle" class="small">I²C 0x53</text>
<rect x="685" y="300" width="180" height="80" rx="7" class="module"/><text x="775" y="325" text-anchor="middle" class="head">MPU / bússola</text><text x="775" y="345" text-anchor="middle" class="body">hw · heading · NVS · tela</text><text x="775" y="363" text-anchor="middle" class="small">I²C 0x68 / 0x0C</text>
<rect x="900" y="300" width="180" height="80" rx="7" class="module"/><text x="990" y="325" text-anchor="middle" class="head">Pedômetro</text><text x="990" y="345" text-anchor="middle" class="body">processo · tarefa · tela</text><text x="990" y="363" text-anchor="middle" class="small">reutiliza mpu9250_hw</text>
</g>

<!-- composição núcleo -> módulos -->
<g fill="none" stroke="#1D7A8C" stroke-width="1.5" marker-end="url(#ctl)">
<path d="M470,130 C400,210 180,230 130,296"/><path d="M515,130 C475,220 370,235 345,296"/><path d="M560,130 L560,296"/><path d="M605,130 C645,220 750,235 775,296"/><path d="M650,130 C720,210 940,230 990,296"/>
</g>
<text x="91" y="254" class="small" fill="#1D7A8C">init / create / show</text>

<!-- módulos -> contrato -->
<g fill="none" stroke="#5B6BA6" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#reg)">
<path d="M130,300 C180,250 420,250 470,224"/><path d="M345,300 C380,260 460,250 505,224"/><path d="M560,300 L560,224"/><path d="M775,300 C740,260 660,250 615,224"/><path d="M990,300 C940,250 700,250 650,224"/>
</g>
<text x="708" y="255" class="small" fill="#5B6BA6">registro de callback / serviço comum</text>

<!-- infraestrutura -->
<rect x="150" y="490" width="360" height="74" rx="8" class="service"/>
<text x="330" y="516" text-anchor="middle" class="head">Serviço i2c_recover</text>
<text x="330" y="536" text-anchor="middle" class="body">reset do barramento após erro de transação</text>
<text x="330" y="553" text-anchor="middle" class="small">usado por MAX30102, LTR390, MPU-9250 e RTC</text>

<rect x="610" y="490" width="360" height="74" rx="8" class="service"/>
<text x="790" y="516" text-anchor="middle" class="head">Infraestrutura compartilhada</text>
<text x="790" y="536" text-anchor="middle" class="body">I²C + mutex · LVGL · NVS · 1-Wire/RMT</text>
<text x="790" y="553" text-anchor="middle" class="small">dependências da plataforma, não entre sensores independentes</text>

<g fill="none" stroke="#C97B1E" stroke-width="1.5" marker-end="url(#infra)">
<path d="M130,380 C130,430 230,450 270,486"/><path d="M560,380 C540,430 410,450 380,486"/><path d="M775,380 C720,430 470,450 430,486"/>
<path d="M990,380 C955,410 875,430 830,486"/>
</g>
<path d="M900,340 C875,390 830,405 790,380" fill="none" stroke="#C97B1E" stroke-width="1.7" marker-end="url(#infra)"/>
<text x="886" y="416" class="small" fill="#C97B1E">driver MPU</text>

<!-- legenda -->
<line x1="110" y1="615" x2="150" y2="615" stroke="#1D7A8C" stroke-width="2" marker-end="url(#ctl)"/><text x="162" y="619" class="body">núcleo compõe módulo</text>
<line x1="390" y1="615" x2="430" y2="615" stroke="#5B6BA6" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#reg)"/><text x="442" y="619" class="body">módulo usa contrato</text>
<line x1="680" y1="615" x2="720" y2="615" stroke="#C97B1E" stroke-width="2" marker-end="url(#infra)"/><text x="732" y="619" class="body">dependência de infraestrutura</text>
</svg>
