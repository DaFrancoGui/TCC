<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 650" font-family="Helvetica" role="img" aria-label="Grafo de dependencias reais do firmware: nucleo compoe os modulos, modulos registram telas pelo contrato app.h, drivers I2C usam recuperacao compartilhada e pedometro reutiliza o driver MPU9250">
<rect width="1120" height="650" fill="#FFFFFF"/>
<defs>
  <marker id="ctl" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#1D7A8C"/></marker>
  <marker id="reg" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#5B6BA6"/></marker>
  <marker id="infra" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#C97B1E"/></marker>
  <style>
    .title{font-size: 22.95px;font-weight:bold;fill:#2B3138}.head{font-size: 17.55px;font-weight:bold;fill:#14515E}.body{font-size: 14.18px;fill:#767D85}.small{font-size: 12.83px;fill:#767D85}.box{fill:#EDF4F6;stroke:#1D7A8C;stroke-width:1.6}.module{fill:#FFFFFF;stroke:#B8BDC3;stroke-width:1.3}.service{fill:#FFF8EF;stroke:#C97B1E;stroke-width:1.5}.contract{fill:#F2F1FA;stroke:#5B6BA6;stroke-width:1.5}
  </style>
</defs>
<text x="560" y="32" text-anchor="middle" class="title">Dependências reais do firmware integrado</text>

<rect x="370" y="50" width="380" height="96" rx="8" class="box"/>
<text x="560" y="78" text-anchor="middle" class="head">Núcleo / composição em main.c</text>
<text x="560" y="101" text-anchor="middle" class="body">inclui cabeçalhos · inicializa módulos</text>
<text x="560" y="120" text-anchor="middle" class="body">cria telas · liga menus</text>
<text x="560" y="138" text-anchor="middle" class="small">ponto central explícito; não há descoberta dinâmica</text>

<rect x="420" y="164" width="280" height="60" rx="7" class="contract"/>
<text x="560" y="188" text-anchor="middle" class="head">Contrato e serviços app.h</text>
<text x="560" y="207" text-anchor="middle" class="body">register_screen · style_btn · perf_read</text>

<!-- módulos -->
<g>
<rect x="40" y="300" width="180" height="80" rx="7" class="module"/><text x="130" y="325" text-anchor="middle" class="head">MAX30102</text><text x="130" y="345" text-anchor="middle" class="body">hw · PPG · FC · SpO₂ · tela</text><text x="130" y="363" text-anchor="middle" class="small">I²C 0x57</text>
<rect x="255" y="300" width="180" height="80" rx="7" class="module"/><text x="345" y="325" text-anchor="middle" class="head">DS18B20</text><text x="345" y="345" text-anchor="middle" class="body">hw · processo · tela</text><text x="345" y="363" text-anchor="middle" class="small">1-Wire / RMT</text>
<rect x="470" y="300" width="180" height="80" rx="7" class="module"/><text x="560" y="325" text-anchor="middle" class="head">LTR390</text><text x="560" y="345" text-anchor="middle" class="body">hw · ALS/UVS · telas</text><text x="560" y="363" text-anchor="middle" class="small">I²C 0x53</text>
<rect x="685" y="300" width="180" height="80" rx="7" class="module"/><text x="775" y="323" text-anchor="middle" class="head">Bússola</text><text x="775" y="342" text-anchor="middle" class="body">heading · calibração · NVS</text><text x="775" y="359" text-anchor="middle" class="small">magnetômetro via</text><text x="775" y="375" text-anchor="middle" class="small">mpu9250_hw</text>
<rect x="900" y="300" width="180" height="80" rx="7" class="module"/><text x="990" y="323" text-anchor="middle" class="head">Pedômetro</text><text x="990" y="342" text-anchor="middle" class="body">processo · tarefa · tela</text><text x="990" y="359" text-anchor="middle" class="small">acelerômetro via</text><text x="990" y="375" text-anchor="middle" class="small">mpu9250_hw</text>
</g>

<!-- composição núcleo -> módulos -->
<g fill="none" stroke="#1D7A8C" stroke-width="1.65" stroke-linejoin="miter">
<path d="M370 98 H250 V270 H990 M250 270 H130"/>
</g>
<g fill="none" stroke="#1D7A8C" stroke-width="1.65" marker-end="url(#ctl)">
<path d="M130 270 V296"/>
<path d="M345 270 V296"/>
<path d="M560 270 V296"/>
<path d="M775 270 V296"/>
<path d="M990 270 V296"/>
</g>

<!-- módulos -> contrato -->
<g fill="none" stroke="#FFFFFF" stroke-width="5">
<path d="M160 300 L470 224"/><path d="M375 300 L515 224"/><path d="M590 300 L560 224"/><path d="M805 300 L615 224"/><path d="M1020 300 L650 224"/>
</g>
<g fill="none" stroke="#5B6BA6" stroke-width="1.54" stroke-dasharray="5 4" marker-end="url(#reg)">
<path d="M160 300 L470 224"/><path d="M375 300 L515 224"/><path d="M590 300 L560 224"/><path d="M805 300 L615 224"/><path d="M1020 300 L650 224"/>
</g>

<!-- infraestrutura -->
<rect x="105" y="480" width="430" height="92" rx="8" class="service"/>
<text x="320" y="506" text-anchor="middle" class="head">Serviço i2c_recover</text>
<text x="320" y="528" text-anchor="middle" class="body">reset do barramento após erro de transação</text>
<text x="320" y="550" text-anchor="middle" class="small">usado por MAX30102, LTR390, MPU-9250 e RTC</text>

<rect x="585" y="480" width="470" height="92" rx="8" class="service"/>
<text x="820" y="506" text-anchor="middle" class="head">Infraestrutura compartilhada</text>
<text x="820" y="528" text-anchor="middle" class="body">I²C + mutex · LVGL · NVS · 1-Wire/RMT</text>
<text x="820" y="548" text-anchor="middle" class="small">mpu9250_hw: acelerômetro para o pedômetro;</text>
<text x="820" y="564" text-anchor="middle" class="small">magnetômetro para a bússola</text>

<path d="M345 380 V405 H650 V476" fill="none" stroke="#FFFFFF" stroke-width="5"/>
<g fill="none" stroke="#C97B1E" stroke-width="1.65" stroke-linejoin="miter" marker-end="url(#infra)">
<path d="M130 380 V430 H220 V476"/>
<path d="M560 380 V430 H380 V476"/>
<path d="M745 380 V450 H450 V476"/>
<path d="M345 380 V405 H650 V476"/>
<path d="M805 380 V476"/>
<path d="M990 380 V430 H930 V476"/>
</g>

<!-- legenda -->
<line x1="110" y1="615" x2="150" y2="615" stroke="#1D7A8C" stroke-width="2.20" marker-end="url(#ctl)"/><text x="162" y="619" class="body">núcleo compõe módulo</text>
<line x1="390" y1="615" x2="430" y2="615" stroke="#5B6BA6" stroke-width="2.20" stroke-dasharray="5 4" marker-end="url(#reg)"/><text x="442" y="619" class="body">módulo usa contrato</text>
<line x1="680" y1="615" x2="720" y2="615" stroke="#C97B1E" stroke-width="2.20" marker-end="url(#infra)"/><text x="732" y="619" class="body">dependência de infraestrutura</text>
</svg>
