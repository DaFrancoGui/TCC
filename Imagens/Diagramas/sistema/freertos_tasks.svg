<text x="54" y="145" text-anchor="middle" font-family="Helvetica" font-size="20.25" fill="#FFFFFF" font-weight="bold">4</text>
<circle cx="54" cy="235" r="15" fill="#1D7A8C"/>
<text x="54" y="240" text-anchor="middle" font-family="Helvetica" font-size="20.25" fill="#FFFFFF" font-weight="bold">3</text>
<circle cx="54" cy="322" r="15" fill="#1D7A8C"/>
<text x="54" y="327" text-anchor="middle" font-family="Helvetica" font-size="20.25" fill="#FFFFFF" font-weight="bold">2</text>
<circle cx="54" cy="386" r="15" fill="#1D7A8C"/>
<text x="54" y="391" text-anchor="middle" font-family="Helvetica" font-size="20.25" fill="#FFFFFF" font-weight="bold">1</text>
<circle cx="54" cy="448" r="15" fill="#1D7A8C"/>
<text x="54" y="453" text-anchor="middle" font-family="Helvetica" font-size="20.25" fill="#FFFFFF" font-weight="bold">0</text>
<rect x="90" y="116" width="550" height="52" rx="5" fill="#EDF4F6" stroke="#1D7A8C" stroke-width="1.65"/>
<text x="102" y="136" text-anchor="start" font-family="Helvetica" font-size="16.88" fill="#14515E" font-weight="bold">LVGL port (esp_lvgl_port)</text>
<text x="102" y="153" text-anchor="start" font-family="Helvetica" font-size="14.18" fill="#767D85">flush por DMA + toque (esp_lcd_touch) · sempre ativa</text>
<text x="90" y="202" text-anchor="start" font-family="Helvetica" font-size="13.50" fill="#767D85" font-style="italic">tasks de sensor — aquisição quando a função está ativa; inativas aguardam 100–200 ms</text>
<rect x="90" y="212" width="106" height="62" rx="5" fill="#FFFFFF" stroke="#B8BDC3" stroke-width="1.32"/>
<text x="143" y="231" text-anchor="middle" font-family="monospace" font-size="13.50" fill="#14515E" font-weight="bold">ppg_task</text>
<text x="143" y="247" text-anchor="middle" font-family="Helvetica" font-size="12.83" fill="#767D85">MAX30102</text>
<text x="143" y="263" text-anchor="middle" font-family="monospace" font-size="10.80" fill="#767D85">30 / 100 ms</text>
<rect x="202" y="212" width="106" height="62" rx="5" fill="#FFFFFF" stroke="#B8BDC3" stroke-width="1.32"/>
<text x="255" y="231" text-anchor="middle" font-family="monospace" font-size="13.50" fill="#14515E" font-weight="bold">temp_task</text>
<text x="255" y="247" text-anchor="middle" font-family="Helvetica" font-size="12.83" fill="#767D85">DS18B20</text>
<text x="255" y="263" text-anchor="middle" font-family="monospace" font-size="9.45" fill="#767D85">conv.+100 / 200 ms</text>
<rect x="314" y="212" width="106" height="62" rx="5" fill="#FFFFFF" stroke="#B8BDC3" stroke-width="1.32"/>
<text x="367" y="231" text-anchor="middle" font-family="monospace" font-size="13.50" fill="#14515E" font-weight="bold">ltr390_task</text>
<text x="367" y="247" text-anchor="middle" font-family="Helvetica" font-size="12.83" fill="#767D85">LTR390</text>
<text x="367" y="263" text-anchor="middle" font-family="monospace" font-size="10.80" fill="#767D85">120 / 200 ms</text>
<rect x="426" y="212" width="106" height="62" rx="5" fill="#FFFFFF" stroke="#B8BDC3" stroke-width="1.32"/>
<text x="479" y="231" text-anchor="middle" font-family="monospace" font-size="13.50" fill="#14515E" font-weight="bold">mpu_task</text>
<text x="479" y="247" text-anchor="middle" font-family="Helvetica" font-size="12.83" fill="#767D85">bússola</text>
<text x="479" y="263" text-anchor="middle" font-family="monospace" font-size="10.80" fill="#767D85">60 / 200 ms</text>
<rect x="538" y="212" width="106" height="62" rx="5" fill="#FFFFFF" stroke="#B8BDC3" stroke-width="1.32"/>
<text x="591" y="231" text-anchor="middle" font-family="monospace" font-size="13.50" fill="#14515E" font-weight="bold">ped_task</text>
<text x="591" y="247" text-anchor="middle" font-family="Helvetica" font-size="12.83" fill="#767D85">pedômetro</text>
<text x="591" y="263" text-anchor="middle" font-family="monospace" font-size="10.80" fill="#767D85">20 / 150 ms</text>
<rect x="90" y="302" width="550" height="40" rx="5" fill="#EDF4F6" stroke="#1D7A8C" stroke-width="1.65"/>
<text x="102" y="318" text-anchor="start" font-family="monospace" font-size="15.53" fill="#14515E" font-weight="bold">screenshot_task</text>
<text x="480" y="318" text-anchor="middle" font-family="Helvetica" font-size="13.50" fill="#767D85">captura da tela pela serial com o botão BOOT</text>
<text x="102" y="335" text-anchor="start" font-family="Helvetica" font-size="12.83" fill="#767D85" font-style="italic">tarefa utilitária entre os sensores e o despacho</text>
<rect x="90" y="368" width="550" height="36" rx="5" fill="#EDF4F6" stroke="#1D7A8C" stroke-width="1.65"/>
<text x="102" y="391" text-anchor="start" font-family="Helvetica" font-size="15.53" fill="#14515E" font-weight="bold">loop de despacho (app_main)</text>
<text x="340" y="391" text-anchor="start" font-family="Helvetica" font-size="13.50" fill="#767D85">500 ms · atualiza a tela ativa</text>
<rect x="90" y="430" width="550" height="36" rx="5" fill="#EDF4F6" stroke="#1D7A8C" stroke-width="1.65"/>
<text x="102" y="453" text-anchor="start" font-family="Helvetica" font-size="15.53" fill="#14515E" font-weight="bold">idle task</text>
<text x="190" y="453" text-anchor="start" font-family="Helvetica" font-size="13.50" fill="#767D85">Task WDT (5 s) · idle hook → estimativa de CPU</text>
<rect x="676" y="112" width="240" height="70" rx="5" fill="#FFFFFF" stroke="#1D7A8C" stroke-width="1.54" stroke-dasharray="5 4"/>
<text x="688" y="135" text-anchor="start" font-family="Helvetica" font-size="15.53" fill="#14515E" font-weight="bold">variáveis volatile</text>
<text x="688" y="154" text-anchor="start" font-family="Helvetica" font-size="12.83" fill="#767D85">BPM · temp · lux · rumo · passos</text>
<text x="688" y="171" text-anchor="start" font-family="Helvetica" font-size="11.48" fill="#767D85" font-style="italic">despacho lê; LVGL renderiza</text>
<rect x="676" y="204" width="240" height="76" rx="5" fill="#FFFFFF" stroke="#1D7A8C" stroke-width="1.54" stroke-dasharray="5 4"/>
<text x="688" y="226" text-anchor="start" font-family="Helvetica" font-size="15.53" fill="#14515E" font-weight="bold">mutex I²C</text>
<text x="688" y="247" text-anchor="start" font-family="Helvetica" font-size="13.50" fill="#767D85">herança de prioridade</text>
<text x="688" y="267" text-anchor="start" font-family="Helvetica" font-size="12.83" fill="#767D85">touch e RTC também usam</text>
<line x1="646" y1="218" x2="672" y2="158" stroke="#1D7A8C" stroke-width="1.76" marker-end="url(#flow)"/>
<text x="638" y="184" text-anchor="start" font-family="Helvetica" font-size="11.48" fill="#767D85" font-style="italic">publica</text>
<line x1="646" y1="242" x2="672" y2="242" stroke="#1D7A8C" stroke-width="1.76" marker-end="url(#flow)"/>
<text x="659" y="235" text-anchor="middle" font-family="Helvetica" font-size="11.48" fill="#767D85" font-style="italic">take/give</text>
</svg>
