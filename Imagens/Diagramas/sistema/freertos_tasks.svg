<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 500" font-family="Helvetica" role="img" aria-label="Mapa de tasks FreeRTOS: LVGL prioridade 4, tasks de sensor prioridade 3, screenshot prioridade 2, loop de despacho prioridade 1, idle prioridade 0, com mutex I2C e handoff por volatile, single-core">
<rect x="0" y="0" width="940" height="500" fill="#FFFFFF"/>
<text x="470" y="32" text-anchor="middle" font-family="Helvetica" font-size="20.25" fill="#2B3138" font-weight="bold">Mapa de tasks FreeRTOS — prioridades e sincronização</text>
<defs>
<marker id="flow" markerWidth="9" markerHeight="9" refX="6" refY="4" orient="auto"><path d="M0,0 L7,4 L0,8 Z" fill="#1D7A8C"/></marker>
</defs>
<rect x="78" y="108" width="574" height="68" rx="5" fill="#F7FAFB" stroke="#E4EAEC" stroke-width="1.10"/>
<rect x="78" y="186" width="574" height="98" rx="5" fill="#F7FAFB" stroke="#E4EAEC" stroke-width="1.10"/>
