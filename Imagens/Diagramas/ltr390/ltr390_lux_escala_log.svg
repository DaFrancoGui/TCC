<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Iluminancia medida pelo LTR390 em escala logaritmica versus faixas de referencia">
  <style>
    text { font-size: 13px; fill: #2B3138; }
    .small { font-size: 11px; fill: #767D85; }
    .zone  { font-size: 11.5px; fill: #8A9097; font-weight: bold; letter-spacing: .02em; }
    .mono  { font-family: 'Courier New', monospace; font-size: 12.5px; fill: #14515E; font-weight: bold; }
    .axis  { font-family: 'Courier New', monospace; font-size: 11.5px; fill: #767D85; }
    .title { font-size: 15px; fill: #2B3138; font-weight: bold; }
  </style>

  <rect x="0" y="0" width="880" height="470" fill="#FFFFFF"/>
  <text x="440" y="32" text-anchor="middle" class="title">Iluminância medida (LTR390) × faixas de referência</text>
  <text x="440" y="50" text-anchor="middle" class="small">escala logarítmica — placa final, Florianópolis, 25/07/2026</text>

  <!-- ===== Faixas de referencia (fundo) ===== -->
  <!-- x(lux) = 90 + log10(lux)*150 ; 1->90 ... 100000->840 -->
  <!-- Noite/urbano 1-50 -->
  <rect x="90"  y="70" width="255" height="230" fill="#F3F4F6"/>
  <!-- Interior 50-1000 -->
  <rect x="345" y="70" width="195" height="230" fill="#FAFAF7"/>
  <!-- Nublado/sombra 1000-20000 -->
  <rect x="540" y="70" width="195" height="230" fill="#F3F4F6"/>
  <!-- Sol direto 20000-100000 -->
  <rect x="735" y="70" width="105" height="230" fill="#FAFAF7"/>

  <text x="217" y="88" text-anchor="middle" class="zone">NOITE / URBANO</text>
  <text x="442" y="88" text-anchor="middle" class="zone">INTERIOR</text>
  <text x="637" y="88" text-anchor="middle" class="zone">NUBLADO / SOMBRA</text>
  <text x="787" y="88" text-anchor="middle" class="zone">SOL DIRETO</text>

  <!-- ===== Eixo log ===== -->
  <line x1="90" y1="300" x2="840" y2="300" stroke="#B8BDC3" stroke-width="1.4"/>
  <!-- decadas: 1,10,100,1k,10k,100k -->
  <g>
    <line x1="90"  y1="300" x2="90"  y2="309" stroke="#B8BDC3"/>
    <line x1="240" y1="300" x2="240" y2="309" stroke="#B8BDC3"/>
    <line x1="390" y1="300" x2="390" y2="309" stroke="#B8BDC3"/>
    <line x1="540" y1="300" x2="540" y2="309" stroke="#B8BDC3"/>
    <line x1="690" y1="300" x2="690" y2="309" stroke="#B8BDC3"/>
    <line x1="840" y1="300" x2="840" y2="309" stroke="#B8BDC3"/>
    <text x="90"  y="324" text-anchor="middle" class="axis">1</text>
    <text x="240" y="324" text-anchor="middle" class="axis">10</text>
    <text x="390" y="324" text-anchor="middle" class="axis">100</text>
    <text x="540" y="324" text-anchor="middle" class="axis">1k</text>
    <text x="690" y="324" text-anchor="middle" class="axis">10k</text>
    <text x="840" y="324" text-anchor="middle" class="axis">100k</text>
  </g>
  <text x="465" y="348" text-anchor="middle" class="small">iluminância (lux) — escala logarítmica</text>

  <!-- ===== Linha de saturacao (teto do ADC) ===== -->
  <!-- 52400 lux -> x = 90 + log10(52400)*150 = 798 -->
  <line x1="798" y1="70" x2="798" y2="300" stroke="#C4453C" stroke-width="1.6" stroke-dasharray="5 4"/>

  <!-- ===== Valores medidos (teal) na linha y=230 ===== -->
  <!-- Escuro total: 0 lux (fora da escala log) -->
  <circle cx="72" cy="230" r="5.5" fill="#1D7A8C"/>
  <text x="72" y="214" text-anchor="middle" class="mono">0</text>
  <text x="72" y="255" text-anchor="middle" class="small">escuro</text>
  <text x="72" y="268" text-anchor="middle" class="small">total</text>

  <!-- Noite 10-30 -->
  <rect x="240" y="225" width="72" height="10" rx="5" fill="#1D7A8C"/>
  <text x="276" y="214" text-anchor="middle" class="mono">10–30</text>

  <!-- Interior 100-150 -->
  <rect x="390" y="225" width="26" height="10" rx="5" fill="#1D7A8C"/>
  <text x="403" y="214" text-anchor="middle" class="mono">100–150</text>

  <!-- Sombra ~4000 -->
  <circle cx="630" cy="230" r="5.5" fill="#1D7A8C"/>
  <text x="630" y="214" text-anchor="middle" class="mono">~4000</text>

  <!-- Sol direto 51-52k (no teto) -->
  <circle cx="797" cy="230" r="5.5" fill="#1D7A8C"/>

  <!-- callout do sol direto + saturacao -->
  <line x1="655" y1="150" x2="795" y2="224" stroke="#C4453C" stroke-width="1"/>
  <text x="650" y="140" text-anchor="end" class="mono" fill="#C4453C">sol direto: 51–52 k lux</text>
  <text x="650" y="156" text-anchor="end" class="small" fill="#C4453C">no teto do ADC — satura em ~52.400 lux</text>
  <text x="650" y="170" text-anchor="end" class="small" fill="#C4453C">(ganho 3×, 18-bit): valor real pode ser maior</text>

  <!-- ===== Legenda ===== -->
  <circle cx="120" cy="440" r="5.5" fill="#1D7A8C"/>
  <text x="134" y="444" class="small">valor medido pelo relógio</text>
  <rect x="330" y="435" width="24" height="10" fill="#F3F4F6" stroke="#B8BDC3" stroke-width="0.5"/>
  <text x="362" y="444" class="small">faixa de referência (tabela de iluminância)</text>
  <line x1="640" y1="440" x2="664" y2="440" stroke="#C4453C" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="672" y="444" class="small">teto de medição (saturação)</text>
</svg>
