<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1030 560" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Diagrama UML do modulo MAX30102 e sua integracao: interface de modulo para o nucleo, pipeline PPG interno (driver, filtro, heart_rate e spo2) na ppg_task, variaveis volateis e tela LVGL, e barramento I2C requerido">
  <style>
    .title  { font-size: 16px; fill: #2B3138; font-weight: bold; }
    .stereo { font-size: 10px; fill: #767D85; font-style: italic; }
    .cname  { font-size: 15px; fill: #14515E; font-weight: bold; }
    .sub    { font-size: 11px; fill: #14515E; font-weight: bold; }
    .part   { font-size: 10.5px; fill: #767D85; }
    .btitle { font-size: 11.5px; fill: #14515E; font-weight: bold; }
    .bpart  { font-size: 9.5px; fill: #767D85; }
    .grp    { font-size: 10.5px; fill: #767D85; font-style: italic; }
    .flowlab{ font-size: 9px; fill: #767D85; font-style: italic; }
    .red    { font-size: 10px; fill: #C4453C; font-weight: bold; }
    .leg    { font-size: 11px; fill: #2B3138; }
  </style>

  <defs>
    <g id="ci">
      <rect x="0" y="0" width="18" height="13" fill="#FFFFFF" stroke="#1D7A8C" stroke-width="1.1"/>
      <rect x="-4" y="2" width="8" height="3.2" fill="#FFFFFF" stroke="#1D7A8C" stroke-width="1.1"/>
      <rect x="-4" y="7" width="8" height="3.2" fill="#FFFFFF" stroke="#1D7A8C" stroke-width="1.1"/>
    </g>
    <marker id="flow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L7,4 L0,8 Z" fill="#1D7A8C"/></marker>
    <marker id="dep" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#767D85" stroke-width="1.3"/></marker>
  </defs>

  <rect x="0" y="0" width="1030" height="560" fill="#FFFFFF"/>
  <text x="515" y="34" text-anchor="middle" class="title">MAX30102 — arquitetura do módulo (FC e SpO2)</text>

  <!-- ===== Referencia ao sistema: nucleo + LVGL ===== -->
  <rect x="70" y="62" width="380" height="60" rx="6" fill="#EDF4F6" stroke="#1D7A8C" stroke-width="1.4"/>
  <use xlink:href="#ci" x="430" y="70"/>
  <text x="84" y="82" class="stereo">«component»</text>
  <text x="84" y="99" class="sub">main.c — núcleo</text>
  <text x="84" y="115" class="part">registro de telas · loop de despacho (500 ms)</text>

  <rect x="610" y="62" width="340" height="60" rx="6" fill="#EDF4F6" stroke="#1D7A8C" stroke-width="1.4"/>
  <use xlink:href="#ci" x="930" y="70"/>
  <text x="624" y="82" class="stereo">«component»</text>
  <text x="624" y="99" class="sub">LVGL + esp_lvgl_port</text>
  <text x="624" y="115" class="part">GC9A01 240×240 · touch</text>

  <!-- provided ball: modulo -> nucleo -->
  <line x1="240" y1="170" x2="240" y2="122" stroke="#B8BDC3" stroke-width="1.2"/>
  <circle cx="240" cy="146" r="6" fill="#1D7A8C"/>

  <!-- dependencia tela -> LVGL -->
  <line x1="891" y1="274" x2="891" y2="124" stroke="#767D85" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#dep)"/>

  <!-- ===== Pacote do modulo ===== -->
  <rect x="70" y="170" width="900" height="210" rx="8" fill="#F7FAFB" stroke="#1D7A8C" stroke-width="1.6" stroke-dasharray="7 4"/>
  <use xlink:href="#ci" x="940" y="178"/>
  <text x="86" y="192" class="stereo">«component»</text>
  <text x="86" y="214" class="cname">MAX30102</text>
  <text x="86" y="232" class="sub">FC · SpO2 · fotopletismografia</text>

  <!-- grupo da task -->
  <rect x="80" y="248" width="544" height="108" rx="6" fill="none" stroke="#767D85" stroke-width="1.1" stroke-dasharray="4 3"/>
  <text x="92" y="264" class="grp">ppg_task (prioridade 3) — aquisição + processamento</text>

  <!-- B1 driver -->
  <rect x="90" y="274" width="152" height="74" rx="4" fill="#FFFFFF" stroke="#B8BDC3" stroke-width="1.2"/>
  <text x="100" y="292" class="btitle">max30102_hw</text>
  <text x="100" y="308" class="bpart">I²C 0x57 · driver</text>
  <text x="100" y="322" class="bpart">FIFO 18-bit @100 Hz</text>
  <text x="100" y="336" class="bpart">shutdown ↔ measuring</text>

  <!-- B2 filtro -->
  <rect x="262" y="274" width="152" height="74" rx="4" fill="#FFFFFF" stroke="#B8BDC3" stroke-width="1.2"/>
  <text x="272" y="292" class="btitle">ppg_filter</text>
  <text x="272" y="308" class="bpart">DC EMA (α=0,005)</text>
  <text x="272" y="322" class="bpart">Butterworth 2ª ordem</text>
  <text x="272" y="336" class="bpart">fc = 5 Hz</text>

  <!-- B3 hr/spo2 -->
  <rect x="434" y="274" width="160" height="74" rx="4" fill="#FFFFFF" stroke="#B8BDC3" stroke-width="1.2"/>
  <text x="444" y="292" class="btitle">heart_rate · spo2</text>
  <text x="444" y="308" class="bpart">limiar adaptativo</text>
  <text x="444" y="322" class="bpart">mediana 8 / 4</text>
  <text x="444" y="336" class="bpart">R → SpO2 (AN6409)</text>

  <!-- B4 valor exibido -->
  <rect x="630" y="284" width="150" height="58" rx="4" fill="#FFFFFF" stroke="#B8BDC3" stroke-width="1.2"/>
  <text x="640" y="304" class="btitle">FC · SpO2</text>
  <text x="640" y="320" class="bpart">valor exibido no display</text>
  <text x="640" y="334" class="bpart">g_bpm · g_spo2 (volátil)</text>

  <!-- B5 tela -->
  <rect x="816" y="274" width="150" height="74" rx="4" fill="#FFFFFF" stroke="#B8BDC3" stroke-width="1.2"/>
  <text x="826" y="294" class="btitle">tela FC/SpO2</text>
  <text x="826" y="310" class="bpart">(LVGL)</text>
  <text x="826" y="326" class="bpart">INICIAR / PARAR</text>

  <!-- fluxo de dados -->
  <g stroke="#1D7A8C" stroke-width="1.6">
    <line x1="242" y1="311" x2="258" y2="311" marker-end="url(#flow)"/>
    <line x1="414" y1="311" x2="430" y2="311" marker-end="url(#flow)"/>
    <line x1="594" y1="311" x2="626" y2="311" marker-end="url(#flow)"/>
    <line x1="782" y1="311" x2="812" y2="311" marker-end="url(#flow)"/>
  </g>
  <text x="250" y="305" text-anchor="middle" class="flowlab">FIFO</text>
  <text x="422" y="305" text-anchor="middle" class="flowlab">AC</text>
  <text x="610" y="305" text-anchor="middle" class="flowlab">publica</text>
  <text x="798" y="305" text-anchor="middle" class="flowlab">exibe</text>

  <!-- required socket (I2C) na fronteira do pacote -->
  <line x1="165" y1="348" x2="165" y2="380" stroke="#B8BDC3" stroke-width="1.2"/>
  <path d="M157,380 A 8 8 0 0 0 173,380" fill="none" stroke="#1D7A8C" stroke-width="2.2"/>
  <line x1="165" y1="380" x2="165" y2="430" stroke="#B8BDC3" stroke-width="1.2"/>

  <!-- I2C bus -->
  <rect x="70" y="430" width="380" height="62" rx="6" fill="#EDF4F6" stroke="#1D7A8C" stroke-width="1.6"/>
  <use xlink:href="#ci" x="430" y="438"/>
  <text x="84" y="450" class="stereo">«component»</text>
  <text x="84" y="468" class="sub">I²C0 — barramento (0x57 · 100 kHz)</text>
  <text x="84" y="484" class="red">mutex + i2c_recover</text>

  <!-- ===== Legenda ===== -->
  <line x1="70" y1="516" x2="960" y2="516" stroke="#ECECEC" stroke-width="1"/>
  <circle cx="82" cy="538" r="6" fill="#1D7A8C"/>
  <text x="98" y="542" class="leg">«Módulo» (fornecida ao núcleo)</text>
  <path d="M318,542 A 8 8 0 0 0 334,542" fill="none" stroke="#1D7A8C" stroke-width="2.2"/>
  <text x="344" y="542" class="leg">requerida: I²C</text>
  <line x1="486" y1="538" x2="514" y2="538" stroke="#1D7A8C" stroke-width="1.6" marker-end="url(#flow)"/>
  <text x="524" y="542" class="leg">fluxo de dados</text>
  <line x1="648" y1="538" x2="690" y2="538" stroke="#767D85" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#dep)"/>
  <text x="700" y="542" class="leg">dependência (cria tela)</text>
</svg>
