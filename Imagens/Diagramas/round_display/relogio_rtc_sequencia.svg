<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 620" font-family="Helvetica" role="img" aria-label="Diagrama de sequencia: configuracao da hora, contagem pelo cristal, sistema desligado por 24h com a CR927 mantendo o RTC, religamento e leitura, com atraso de 2 segundos">
<rect x="0" y="0" width="920" height="620" fill="#FFFFFF"/>
<text x="460" y="32" text-anchor="middle" font-family="Helvetica" font-size="15" fill="#2B3138" font-weight="bold">Relógio — manutenção da hora com o sistema desligado (backup CR927)</text>
<defs>
<marker id="call" markerWidth="11" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#2B3138"/></marker>
<marker id="ret" markerWidth="11" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8" fill="none" stroke="#767D85" stroke-width="1.2"/></marker>
</defs>
<rect x="45" y="258" width="830" height="76" fill="#F2F2F2"/>
<rect x="60" y="52" width="140" height="34" rx="5" fill="#EDF4F6" stroke="#1D7A8C" stroke-width="1.5"/>
<text x="130" y="74" text-anchor="middle" font-family="Helvetica" font-size="12" fill="#2B3138" font-weight="bold">Usuário / oficial</text>
<line x1="130" y1="92" x2="130" y2="258" stroke="#B8BDC3" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="130" y1="334" x2="130" y2="540" stroke="#B8BDC3" stroke-width="1" stroke-dasharray="4 4"/>
<rect x="280" y="52" width="140" height="34" rx="5" fill="#EDF4F6" stroke="#1D7A8C" stroke-width="1.5"/>
<text x="350" y="74" text-anchor="middle" font-family="Helvetica" font-size="12" fill="#2B3138" font-weight="bold">main.c</text>
<line x1="350" y1="92" x2="350" y2="258" stroke="#B8BDC3" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="350" y1="334" x2="350" y2="540" stroke="#B8BDC3" stroke-width="1" stroke-dasharray="4 4"/>
<rect x="490" y="52" width="140" height="34" rx="5" fill="#EDF4F6" stroke="#1D7A8C" stroke-width="1.5"/>
<text x="560" y="74" text-anchor="middle" font-family="monospace" font-size="12" fill="#2B3138" font-weight="bold">rtc_pcf8563</text>
<line x1="560" y1="92" x2="560" y2="258" stroke="#B8BDC3" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="560" y1="334" x2="560" y2="540" stroke="#B8BDC3" stroke-width="1" stroke-dasharray="4 4"/>
<rect x="720" y="52" width="140" height="34" rx="5" fill="#EDF4F6" stroke="#1D7A8C" stroke-width="1.5"/>
<text x="790" y="74" text-anchor="middle" font-family="monospace" font-size="12" fill="#2B3138" font-weight="bold">PCF8563 + CR927</text>
<line x1="790" y1="92" x2="790" y2="540" stroke="#B8BDC3" stroke-width="1" stroke-dasharray="4 4"/>
<rect x="785" y="258" width="10" height="76" fill="#C97B1E"/>
<line x1="130" y1="126" x2="350" y2="126" stroke="#2B3138" stroke-width="1.3" marker-end="url(#call)"/>
<text x="240" y="120" text-anchor="middle" font-family="Helvetica" font-size="10.5" fill="#2B3138">configura hora (na troca de minuto oficial)</text>
<line x1="350" y1="164" x2="560" y2="164" stroke="#2B3138" stroke-width="1.3" marker-end="url(#call)"/>
<text x="455" y="158" text-anchor="middle" font-family="Helvetica" font-size="10.5" fill="#2B3138">set_time(BCD)</text>
<line x1="560" y1="202" x2="790" y2="202" stroke="#2B3138" stroke-width="1.3" marker-end="url(#call)"/>
<text x="675" y="196" text-anchor="middle" font-family="Helvetica" font-size="10.5" fill="#2B3138">grava 7 bytes @0x02 (I²C)</text>
<rect x="672" y="222" width="196" height="24" rx="3" fill="#FBFCFC" stroke="#B8BDC3" stroke-width="1"/>
<text x="770" y="238" text-anchor="middle" font-family="Helvetica" font-size="10.5" fill="#767D85">conta pelo cristal (32,768 kHz)</text>
<text x="300" y="300" text-anchor="middle" font-family="Helvetica" font-size="12" fill="#2B3138" font-weight="bold">sistema DESLIGADO — 24 h</text>
<text x="775" y="300" text-anchor="end" font-family="Helvetica" font-size="10.5" fill="#C97B1E" font-weight="bold">CR927 mantém o RTC</text>
<text x="460" y="352" text-anchor="middle" font-family="Helvetica" font-size="10.5" fill="#767D85">— sistema LIGADO —</text>
<line x1="350" y1="378" x2="560" y2="378" stroke="#2B3138" stroke-width="1.3" marker-end="url(#call)"/>
<text x="455" y="372" text-anchor="middle" font-family="Helvetica" font-size="10.5" fill="#2B3138">read_time()</text>
<line x1="560" y1="414" x2="790" y2="414" stroke="#2B3138" stroke-width="1.3" marker-end="url(#call)"/>
<text x="675" y="408" text-anchor="middle" font-family="Helvetica" font-size="10.5" fill="#2B3138">lê 7 bytes @0x02 (I²C)</text>
<line x1="790" y1="450" x2="560" y2="450" stroke="#2B3138" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#ret)"/>
<text x="675" y="444" text-anchor="middle" font-family="Helvetica" font-size="10.5" fill="#767D85">hora (BCD)</text>
<line x1="560" y1="486" x2="350" y2="486" stroke="#2B3138" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#ret)"/>
<text x="455" y="480" text-anchor="middle" font-family="Helvetica" font-size="10.5" fill="#767D85">hora</text>
<line x1="350" y1="522" x2="130" y2="522" stroke="#2B3138" stroke-width="1.3" marker-end="url(#call)"/>
<text x="240" y="516" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="10.5" fill="#2B3138">tela principal exibe</text>
<rect x="90" y="556" width="560" height="42" rx="4" fill="#FBF3F2" stroke="#C97B1E" stroke-width="1"/>
<text x="104" y="574" text-anchor="start" font-family="Helvetica" font-size="11" fill="#2B3138" font-weight="bold">confere com a hora oficial:</text>
<text x="104" y="590" text-anchor="start" font-family="Helvetica" font-size="10.5" fill="#767D85">atraso de 2 s em 24 h  ≈  ~2 s/dia (~23 ppm) — ordem de grandeza esperada</text>
</svg>
