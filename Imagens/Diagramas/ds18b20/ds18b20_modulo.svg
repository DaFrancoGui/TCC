<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1030 560" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Diagrama UML do modulo DS18B20 e sua integracao: interface de modulo para o nucleo, driver 1-Wire e temp_task com filtro, tela LVGL, e transporte 1-Wire (ambar) distinto do barramento I2C">
  <style>
    .title  { font-size: 16px; fill: #2B3138; font-weight: bold; }
    .stereo { font-size: 10px; fill: #767D85; font-style: italic; }
    .cname  { font-size: 15px; fill: #14515E; font-weight: bold; }
    .sub    { font-size: 11px; fill: #14515E; font-weight: bold; }
    .part   { font-size: 10.5px; fill: #767D85; }
    .btitle { font-size: 11.5px; fill: #14515E; font-weight: bold; }
    .bpart  { font-size: 9.5px; fill: #767D85; }
    .grp    { font-size: 10.5px; fill: #767D85; font-style: italic; }
    .flowlab{ font-size: 9px; fill: #767D85; font-style: italic; }
    .red    { font-size: 10px; fill: #C4453C; font-weight: bold; }
    .amber  { font-size: 10px; fill: #C97B1E; font-weight: bold; }
    .leg    { font-size: 11px; fill: #2B3138; }
  </style>

  <defs>
    <g id="ci">
      <rect x="0" y="0" width="18" height="13" fill="#FFFFFF" stroke="#1D7A8C" stroke-width="1.1"/>
      <rect x="-4" y="2" width="8" height="3.2" fill="#FFFFFF" stroke="#1D7A8C" stroke-width="1.1"/>
      <rect x="-4" y="7" width="8" height="3.2" fill="#FFFFFF" stroke="#1D7A8C" stroke-width="1.1"/>
    </g>
    <marker id="flow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L7,4 L0,8 Z" fill="#1D7A8C"/></marker>
    <marker id="dep" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#767D85" stroke-width="1.3"/></marker>
  </defs>

  <rect x="0" y="0" width="1030" height="560" fill="#FFFFFF"/>
  <text x="515" y="34" text-anchor="middle" class="title">DS18B20 — arquitetura do módulo (temperatura)</text>

  <!-- ===== Referencia ao sistema ===== -->
  <rect x="70" y="62" width="380" height="60" rx="6" fill="#EDF4F6" stroke="#1D7A8C" stroke-width="1.4"/>
  <use xlink:href="#ci" x="430" y="70"/>
  <text x="84" y="82" class="stereo">«component»</text>
  <text x="84" y="99" class="sub">main.c — núcleo</text>
  <text x="84" y="115" class="part">registro de telas · loop de despacho (500 ms)</text>

  <rect x="610" y="62" width="340" height="60" rx="6" fill="#EDF4F6" stroke="#1D7A8C" stroke-width="1.4"/>
  <use xlink:href="#ci" x="930" y="70"/>
  <text x="624" y="82" class="stereo">«component»</text>
  <text x="624" y="99" class="sub">LVGL + esp_lvgl_port</text>
  <text x="624" y="115" class="part">GC9A01 240×240 · touch</text>

  <line x1="240" y1="170" x2="240" y2="122" stroke="#B8BDC3" stroke-width="1.2"/>
  <circle cx="240" cy="146" r="6" fill="#1D7A8C"/>

  <line x1="891" y1="274" x2="891" y2="124" stroke="#767D85" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#dep)"/>

  <!-- ===== Pacote do modulo ===== -->
  <rect x="70" y="170" width="900" height="210" rx="8" fill="#F7FAFB" stroke="#1D7A8C" stroke-width="1.6" stroke-dasharray="7 4"/>
  <use xlink:href="#ci" x="940" y="178"/>
  <text x="86" y="192" class="stereo">«component»</text>
  <text x="86" y="214" class="cname">DS18B20</text>
  <text x="86" y="232" class="sub">temperatura · 1-Wire</text>

  <rect x="80" y="248" width="374" height="108" rx="6" fill="none" stroke="#767D85" stroke-width="1.1" stroke-dasharray="4 3"/>
  <text x="92" y="264" class="grp">temp_task — leitura contínua</text>

  <!-- B1 driver -->
  <rect x="90" y="274" width="162" height="74" rx="4" fill="#FFFFFF" stroke="#B8BDC3" stroke-width="1.2"/>
  <text x="100" y="292" class="btitle">onewire + ds18b20</text>
  <text x="100" y="308" class="bpart">1-Wire · RMT (GPIO20)</text>
  <text x="100" y="322" class="bpart">12-bit · 0,0625 °C</text>
  <text x="100" y="336" class="bpart">CONVERT_T→750ms→CRC</text>

  <!-- B2 processamento -->
  <rect x="282" y="274" width="162" height="74" rx="4" fill="#FFFFFF" stroke="#B8BDC3" stroke-width="1.2"/>
  <text x="292" y="292" class="btitle">processamento</text>
  <text x="292" y="308" class="bpart">faixa −10..60 °C</text>
  <text x="292" y="322" class="bpart">EMA α=0,3 (debug)</text>
  <text x="292" y="336" class="bpart">arredonda 1 casa</text>

  <!-- B3 valor exibido -->
  <rect x="630" y="284" width="150" height="58" rx="4" fill="#FFFFFF" stroke="#B8BDC3" stroke-width="1.2"/>
  <text x="640" y="304" class="btitle">Temperatura</text>
  <text x="640" y="320" class="bpart">valor exibido no display</text>
  <text x="640" y="334" class="bpart">g_temp (volátil)</text>

  <!-- B4 tela -->
  <rect x="816" y="274" width="150" height="74" rx="4" fill="#FFFFFF" stroke="#B8BDC3" stroke-width="1.2"/>
  <text x="826" y="294" class="btitle">tela Temperatura</text>
  <text x="826" y="310" class="bpart">(LVGL)</text>
  <text x="826" y="326" class="bpart">formatação inteira</text>

  <g stroke="#1D7A8C" stroke-width="1.6">
    <line x1="252" y1="311" x2="278" y2="311" marker-end="url(#flow)"/>
    <line x1="444" y1="311" x2="626" y2="311" marker-end="url(#flow)"/>
    <line x1="782" y1="311" x2="812" y2="311" marker-end="url(#flow)"/>
  </g>
  <text x="265" y="305" text-anchor="middle" class="flowlab">raw</text>
  <text x="535" y="305" text-anchor="middle" class="flowlab">°C · publica</text>
  <text x="798" y="305" text-anchor="middle" class="flowlab">exibe</text>

  <!-- required socket (1-Wire, AMBAR) na fronteira do pacote -->
  <line x1="171" y1="348" x2="171" y2="380" stroke="#C97B1E" stroke-width="1.7"/>
  <path d="M162,380 A 9 9 0 0 0 180,380" fill="none" stroke="#C97B1E" stroke-width="2.6"/>
  <line x1="171" y1="380" x2="171" y2="430" stroke="#C97B1E" stroke-width="1.7"/>

  <!-- 1-Wire / RMT -->
  <rect x="70" y="430" width="380" height="62" rx="6" fill="#EDF4F6" stroke="#1D7A8C" stroke-width="1.6"/>
  <use xlink:href="#ci" x="430" y="438"/>
  <text x="84" y="450" class="stereo">«component»</text>
  <text x="84" y="468" class="sub">1-Wire / RMT (GPIO20)</text>
  <text x="84" y="484" class="amber">pulsos por HW · sem (bus, mutex)</text>

  <!-- ===== Legenda ===== -->
  <line x1="70" y1="516" x2="960" y2="516" stroke="#ECECEC" stroke-width="1"/>
  <circle cx="82" cy="538" r="6" fill="#1D7A8C"/>
  <text x="98" y="542" class="leg">«Módulo» (fornecida ao núcleo)</text>
  <path d="M317,542 A 9 9 0 0 0 335,542" fill="none" stroke="#C97B1E" stroke-width="2.6"/>
  <text x="345" y="542" class="leg">requerida: 1-Wire</text>
  <line x1="500" y1="538" x2="528" y2="538" stroke="#1D7A8C" stroke-width="1.6" marker-end="url(#flow)"/>
  <text x="538" y="542" class="leg">fluxo de dados</text>
  <line x1="662" y1="538" x2="704" y2="538" stroke="#767D85" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#dep)"/>
  <text x="714" y="542" class="leg">dependência (cria tela)</text>
</svg>
